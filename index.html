    function ensureExamSeriesOrder(exam) {
      if (!exam.seriesOrder || !Array.isArray(exam.seriesOrder) || exam.seriesOrder.length !== 4) {
        exam.seriesOrder = [0, 1, 2, 3];
      }
    }

    function getOrderedSeries(exam, phaseOffset = 0) {
      ensureExamSeriesOrder(exam);
      const catalog = getExamSeriesCatalog(exam, phaseOffset);
      return exam.seriesOrder.map(id => catalog[id]);
    }

    function renderPacsViewport(exam) {
      const viewport = document.getElementById("pacs-viewport");
      const reorderPanel = document.getElementById("pacs-reorder-panel");

      if (exam.imageStatus === "未照") {
        stopCinePlayback(false);
        if (reorderPanel) reorderPanel.classList.add("hidden");
        viewport.innerHTML = `
          <div class="pacs-placeholder-icon">⚠️</div>
          <div style="font-size: 16px; font-weight: 700; color: #fca5a5;">影像顯示區：尚未照影像（未照）</div>
          <p style="font-size: 12.5px; color: #94a3b8; margin-top: 6px;">
            此檢查單（${exam.id}）目前尚無 PACS 影像可供調閱。
          </p>
        `;
      } else {
        const orderedFrames = getOrderedSeries(exam, cinePhase);
        if (currentSeriesPos >= orderedFrames.length) currentSeriesPos = 0;
        const activeFrame = orderedFrames[currentSeriesPos];
        const cineStatusTag = isCinePlaying ? ` ｜ <strong style="color:#4ade80;">● CINE 播放中</strong>` : "";

        viewport.innerHTML = `
          <div class="pacs-overlay-info">
            <div><strong>${exam.id}</strong> ｜ ${exam.patientName} (${exam.gender}/${exam.age})</div>
            <div>檢查：${exam.examName}</div>
            <div>切面/序列：<strong style="color:#facc15;">#${currentSeriesPos + 1} ${activeFrame.title}</strong></div>
          </div>

          <div class="pacs-canvas-stage" id="pacs-canvas-stage" title="滾輪可放大縮小、按住左鍵可拖曳平移、雙擊快速放大/還原">
            ${activeFrame.svg}
            <div style="font-size: 13px; font-weight: 700; color: #38bdf8; margin-top: 8px;">
              🩻 #${currentSeriesPos + 1} ${activeFrame.title}（滾輪縮放、拖曳平移、雙擊放大）
            </div>
          </div>

          <div class="pacs-zoom-OSD">
            <span id="pacs-status-line">W/L: ${activeFrame.wl} ｜ Zoom: <strong id="pacs-zoom-label" style="color:#38bdf8;">${Math.round(pacsZoom * 100)}%</strong> ｜ Series: <strong style="color:#facc15;">${currentSeriesPos + 1}/${orderedFrames.length}</strong>${cineStatusTag}</span>
          </div>
        `;

        updatePacsTransform();
        bindPacsCanvasEvents();
        if (isReorderPanelOpen) {
          renderReorderPanel(exam);
        }
      }
    }

    // 切換展開/收合「調整影像順序」面板
    function toggleReorderPanel() {
      const exam = exams.find(e => e.id === currentExamId);
      if (!exam || exam.imageStatus === "未照") {
        showToast("此檢查單尚未照影像，無影像序列可調整順序");
        return;
      }
      isReorderPanelOpen = !isReorderPanelOpen;
      const panel = document.getElementById("pacs-reorder-panel");
      const btn = document.getElementById("btn-pacs-reorder");
      if (isReorderPanelOpen) {
        panel.classList.remove("hidden");
        if (btn) btn.classList.add("active-fullscreen");
        renderReorderPanel(exam);
        showToast("↕️ 已展開影像順序調整列：可拖曳卡片或點擊 ◀ / ▶ 調整影像順序");
      } else {
        panel.classList.add("hidden");
        if (btn) btn.classList.remove("active-fullscreen");
      }
    }

    function renderReorderPanel(exam) {
      const panel = document.getElementById("pacs-reorder-panel");
      if (!panel || !exam || exam.imageStatus === "未照") return;
      const orderedFrames = getOrderedSeries(exam, cinePhase);

      const cardsHtml = orderedFrames.map((frame, posIdx) => `
        <div
          class="series-thumb-card ${posIdx === currentSeriesPos ? 'active' : ''}"
          draggable="true"
          ondragstart="onThumbDragStart(event, ${posIdx})"
          ondragover="onThumbDragOver(event)"
          ondrop="onThumbDrop(event, ${posIdx})"
          onclick="selectSeriesFrame(${posIdx})"
          title="點選檢視此張影像，或按住拖曳與其他影像交換順序"
        >
          <div style="font-weight:700; color:#facc15; margin-bottom:2px;">順序 #${posIdx + 1}</div>
          <div style="color:#e2e8f0; font-size:11px; line-height:1.3; min-height:28px; display:flex; align-items:center;">${frame.title}</div>
          <div class="thumb-move-btns" onclick="event.stopPropagation();">
            <button type="button" class="thumb-move-btn" onclick="moveSeriesItem(${posIdx}, ${posIdx - 1})" ${posIdx === 0 ? "disabled" : ""} title="往前移">◀</button>
            <button type="button" class="thumb-move-btn" onclick="moveSeriesItem(${posIdx}, ${posIdx + 1})" ${posIdx === orderedFrames.length - 1 ? "disabled" : ""} title="往後移">▶</button>
          </div>
        </div>
      `).join("");

      panel.innerHTML = `
        <div class="reorder-header">
          <span><strong>↕️ 影像序列順序調整（共 ${orderedFrames.length} 張）</strong>：點選可切換影像，拖曳或按 ◀ ▶ 可調整順序</span>
          <div style="display:inline-flex; gap:6px;">
            <button type="button" class="btn btn-sm btn-dark" onclick="reverseSeriesOrder()">⇅ 反轉順序</button>
            <button type="button" class="btn btn-sm btn-dark" onclick="resetSeriesOrder()">預設順序</button>
          </div>
        </div>
        <div class="series-thumb-list">
          ${cardsHtml}
        </div>
      `;
    }

    function selectSeriesFrame(posIdx) {
      const exam = exams.find(e => e.id === currentExamId);
      if (!exam) return;
      currentSeriesPos = posIdx;
      renderPacsViewport(exam);
    }

    function moveSeriesItem(fromPos, toPos) {
      const exam = exams.find(e => e.id === currentExamId);
      if (!exam) return;
      ensureExamSeriesOrder(exam);
      if (toPos < 0 || toPos >= exam.seriesOrder.length) return;

      const temp = exam.seriesOrder[fromPos];
      exam.seriesOrder[fromPos] = exam.seriesOrder[toPos];
      exam.seriesOrder[toPos] = temp;
      currentSeriesPos = toPos;
      renderPacsViewport(exam);
      showToast(`已將影像移至順序 #${toPos + 1}`);
    }

    function onThumbDragStart(e, posIdx) {
      draggedThumbPos = posIdx;
      if (e.currentTarget) e.currentTarget.classList.add("dragging-thumb");
    }

    function onThumbDragOver(e) {
      e.preventDefault();
    }

    function onThumbDrop(e, targetPosIdx) {
      e.preventDefault();
      if (draggedThumbPos === null || draggedThumbPos === targetPosIdx) return;
      const exam = exams.find(e => e.id === currentExamId);
      if (!exam) return;
      ensureExamSeriesOrder(exam);

      const movedItem = exam.seriesOrder.splice(draggedThumbPos, 1)[0];
      exam.seriesOrder.splice(targetPosIdx, 0, movedItem);
      currentSeriesPos = targetPosIdx;
      draggedThumbPos = null;
      renderPacsViewport(exam);
      showToast(`已透過拖曳更新影像順序（目前顯示 #${targetPosIdx + 1}）`);
    }

    function reverseSeriesOrder() {
      const exam = exams.find(e => e.id === currentExamId);
      if (!exam) return;
      ensureExamSeriesOrder(exam);
      exam.seriesOrder.reverse();
      currentSeriesPos = 0;
      renderPacsViewport(exam);
      showToast("⇅ 已反轉影像序列順序");
    }

    function resetSeriesOrder() {
      const exam = exams.find(e => e.id === currentExamId);
      if (!exam) return;
      exam.seriesOrder = [0, 1, 2, 3];
      currentSeriesPos = 0;
      renderPacsViewport(exam);
      showToast("已恢復預設影像序列順序");
    }

    // 播放 / 暫停動態影像 (Cine Loop) 真實功能
    function toggleCinePlayback() {
      const exam = exams.find(e => e.id === currentExamId);
      if (!exam || exam.imageStatus === "未照") {
        showToast("此檢查單尚未照影像，無法播放動態影像");
        return;
      }
      if (isCinePlaying) {
        stopCinePlayback(true);
      } else {
        startCinePlayback();
      }
    }

    function startCinePlayback() {
      const exam = exams.find(e => e.id === currentExamId);
      if (!exam) return;
      isCinePlaying = true;
      const btn = document.getElementById("btn-pacs-cine");
      if (btn) {
        btn.innerHTML = "⏸️ 暫停";
        btn.classList.add("active-fullscreen");
      }
      showToast("▶️ 開始播放動態影像序列（依目前設定之影像順序循環播放）");

      if (cineTimer) clearInterval(cineTimer);
      cineTimer = setInterval(() => {
        const curExam = exams.find(e => e.id === currentExamId);
        if (!curExam || curExam.imageStatus === "未照") {
          stopCinePlayback(false);
          return;
        }
        cinePhase++;
        // 每 3 個動態相位切換至下一張序列切面，同時呈現連續搏動與序列循環
        if (cinePhase % 3 === 0) {
          const ordered = getOrderedSeries(curExam, cinePhase);
          currentSeriesPos = (currentSeriesPos + 1) % ordered.length;
        }
        renderPacsViewport(curExam);
      }, 240);
    }

    function stopCinePlayback(notify = false) {
      if (cineTimer) {
        clearInterval(cineTimer);
        cineTimer = null;
      }
      const wasPlaying = isCinePlaying;
      isCinePlaying = false;
      const btn = document.getElementById("btn-pacs-cine");
      if (btn) {
        btn.innerHTML = "▶️ 播放";
        btn.classList.remove("active-fullscreen");
      }
      if (wasPlaying) {
        const curExam = exams.find(e => e.id === currentExamId);
        if (curExam) renderPacsViewport(curExam);
        if (notify) showToast("⏸️ 已暫停動態影像播放");
      }
    }

    function updatePacsTransform() {
      const stage = document.getElementById("pacs-canvas-stage");
      const zoomLabel = document.getElementById("pacs-zoom-label");
      if (stage) {
        stage.style.transform = `translate(${pacsPanX}px, ${pacsPanY}px) scale(${pacsZoom})`;
      }
      if (zoomLabel) {
        zoomLabel.textContent = `${Math.round(pacsZoom * 100)}%`;
      }
    }

    function zoomPacsImage(delta) {
      const nextZoom = Math.min(4.0, Math.max(0.5, +(pacsZoom + delta).toFixed(2)));
      pacsZoom = nextZoom;
      if (pacsZoom === 1.0) {
        pacsPanX = 0;
        pacsPanY = 0;
      }
      updatePacsTransform();
    }

    function resetPacsZoom() {
      pacsZoom = 1.0;
      pacsPanX = 0;
      pacsPanY = 0;
      updatePacsTransform();
      showToast("已將影像縮放比例重置為 100%");
    }

    function bindPacsCanvasEvents() {
      const viewport = document.getElementById("pacs-viewport");
      const stage = document.getElementById("pacs-canvas-stage");
      if (!viewport || !stage) return;

      // 滑鼠滾輪縮放
      viewport.onwheel = function(e) {
        e.preventDefault();
        const delta = e.deltaY < 0 ? 0.2 : -0.2;
        zoomPacsImage(delta);
      };

      // 雙擊快速切換 200% 放大 / 100% 還原
      stage.ondblclick = function(e) {
        e.preventDefault();
        if (pacsZoom === 1.0) {
          pacsZoom = 2.0;
          showToast("🔍 已放大影像至 200%（可按住滑鼠拖曳平移，再次雙擊還原）");
        } else {
          pacsZoom = 1.0;
          pacsPanX = 0;
          pacsPanY = 0;
        }
        updatePacsTransform();
      };

      // 滑鼠按住拖曳平移 (Pan)
      stage.onmousedown = function(e) {
        if (e.button !== 0) return;
        isPacsDragging = true;
        dragStartX = e.clientX - pacsPanX;
        dragStartY = e.clientY - pacsPanY;
        stage.classList.add("dragging");
      };

      window.addEventListener("mousemove", function(e) {
        if (!isPacsDragging) return;
        pacsPanX = e.clientX - dragStartX;
        pacsPanY = e.clientY - dragStartY;
        updatePacsTransform();
      });

      window.addEventListener("mouseup", function() {
        if (isPacsDragging) {
          isPacsDragging = false;
          const st = document.getElementById("pacs-canvas-stage");
          if (st) st.classList.remove("dragging");
        }
      });
    }

    // 切換 PACS 影像區全螢幕檢視模式（真實功能）
    function togglePacsFullscreen() {
      const pacsPanel = document.getElementById("pacs-panel");
      const btnFull = document.getElementById("btn-pacs-fullscreen");
      const btnExitTop = document.getElementById("btn-exit-fullscreen-top");
      const btnOsdFull = document.getElementById("btn-osd-fullscreen");

      isPacsFullscreen = !isPacsFullscreen;

      if (isPacsFullscreen) {
        pacsPanel.classList.add("pacs-fullscreen");
        if (btnFull) {
          btnFull.innerHTML = "🗗 退出全螢幕 (Esc)";
          btnFull.classList.add("active-fullscreen");
        }
        if (btnExitTop) btnExitTop.classList.remove("hidden");
        if (btnOsdFull) btnOsdFull.innerHTML = "🗗";

        // 進入全螢幕時若原本為 100%，自動微幅放大至 150% 展現大圖細節
        if (pacsZoom === 1.0) {
          pacsZoom = 1.5;
          updatePacsTransform();
        }
        showToast("🔍 已進入 PACS 全螢幕放大檢視模式（可用滾輪縮放、按住拖曳，按 Esc 退出）");
      } else {
        pacsPanel.classList.remove("pacs-fullscreen");
        if (btnFull) {
          btnFull.innerHTML = "⛶ 全螢幕";
          btnFull.classList.remove("active-fullscreen");
        }
        if (btnExitTop) btnExitTop.classList.add("hidden");
        if (btnOsdFull) btnOsdFull.innerHTML = "⛶";
        showToast("已退出全螢幕檢視模式");
      }
    }

    function renderHistoryList(exam) {
      const listEl = document.getElementById("history-list-container");
      const previewEl = document.getElementById("history-preview-box");
      if (selectedHistoryIndex === null) {
        previewEl.classList.add("hidden");
      }

      if (!exam.historyReports || exam.historyReports.length === 0) {
        listEl.innerHTML = `<div style="font-size: 12px; color: var(--text-muted); padding: 6px 0;">此病人無過去歷史影像與報告紀錄。</div>`;
        return;
      }

      listEl.innerHTML = exam.historyReports.map((h, idx) => {
        const isOpen = selectedHistoryIndex === idx;
        return `
          <div class="history-item ${isOpen ? 'active' : ''}" onclick="previewHistoryReport(${idx})">
            <div style="display:flex; justify-content:space-between; font-weight:700;">
              <span>${h.date} — ${h.examName}</span>
              <span style="color:var(--primary);">${isOpen ? '收合預覽 ▴' : '點選預覽 ▾'}</span>
            </div>
          </div>
        `;
      }).join("");
    }

    function previewHistoryReport(idx) {
      const exam = exams.find(e => e.id === currentExamId);
      if (!exam || !exam.historyReports[idx]) return;
      const previewEl = document.getElementById("history-preview-box");

      // 點選第二次同一個項目即可收合預覽視窗
      if (selectedHistoryIndex === idx && !previewEl.classList.contains("hidden")) {
        selectedHistoryIndex = null;
        isComparingHistoryInMain = false;
        previewEl.classList.add("hidden");
        renderHistoryList(exam);
        renderPacsViewport(exam);
        return;
      }

      selectedHistoryIndex = idx;
      renderHistoryList(exam);

      const h = exam.historyReports[idx];
      previewEl.classList.remove("hidden");

      // 取得對應類別的歷史醫學影像 SVG（縮圖預覽與可放大對照）
      const catalog = getExamSeriesCatalog(exam, 0);
      const historySvg = catalog[0].svg
        .replace('width="260" height="220"', 'width="165" height="138"');

      const fieldsHtml = Object.entries(h.fields).map(([k, v]) => `<div><strong>${k}:</strong> ${v}</div>`).join("");
      previewEl.innerHTML = `
        <div style="display: flex; gap: 12px; align-items: stretch; flex-wrap: wrap;">
          <div style="background: #020617; border: 1.5px solid #334155; border-radius: 10px; padding: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 185px;">
            <div style="font-size: 11px; font-weight: 700; color: #38bdf8; margin-bottom: 4px;">${h.date}</div>
            ${historySvg}
            <button type="button" class="btn btn-sm btn-dark" style="margin-top: 6px; width: 100%; flex: none;" onclick="toggleHistoryImageCompare(${idx})">
              ${isComparingHistoryInMain ? '🗗 關閉主畫面並排對照' : '🔍 於主畫面並排對照影像'}
            </button>
          </div>
          <div style="flex: 1; min-width: 200px; display: flex; flex-direction: column; justify-content: space-between;">
            <div style="margin-bottom:10px; line-height:1.45;">${fieldsHtml}</div>
            <div>
              <button class="btn btn-sm btn-primary" onclick="applyHistoryReport(${idx})">📥 確認帶入此歷史報告內容</button>
            </div>
          </div>
        </div>
      `;
    }

    let isComparingHistoryInMain = false;

    function toggleHistoryImageCompare(idx) {
      const exam = exams.find(e => e.id === currentExamId);
      if (!exam || !exam.historyReports || !exam.historyReports[idx]) return;
      isComparingHistoryInMain = !isComparingHistoryInMain;
      const h = exam.historyReports[idx];
      const viewport = document.getElementById("pacs-viewport");

      if (isComparingHistoryInMain && exam.imageStatus === "已照") {
        stopCinePlayback(false);
        const orderedFrames = getOrderedSeries(exam, cinePhase);
        const activeFrame = orderedFrames[currentSeriesPos] || orderedFrames[0];
        const curSvg = activeFrame.svg.replace('width="260" height="220"', 'width="210" height="180"');
        const histSvg = orderedFrames[0].svg.replace('width="260" height="220"', 'width="210" height="180"');

        viewport.innerHTML = `
          <div class="pacs-overlay-info">
            <div><strong>並排對照模式</strong> ｜ ${exam.patientName} (${exam.gender}/${exam.age})</div>
            <div>左：本次 (${exam.examDate}) vs 右：歷史 (${h.date})</div>
          </div>
          <div class="pacs-canvas-stage" id="pacs-canvas-stage" style="flex-direction: row; gap: 12px; flex-wrap: nowrap;">
            <div style="display:flex; flex-direction:column; align-items:center;">
              <span style="font-size:11.5px; font-weight:700; color:#facc15; margin-bottom:4px;">📍 本次影像 (${exam.examDate})</span>
              ${curSvg}
            </div>
            <div style="display:flex; flex-direction:column; align-items:center;">
              <span style="font-size:11.5px; font-weight:700; color:#38bdf8; margin-bottom:4px;">📅 歷史影像 (${h.date})</span>
              ${histSvg}
            </div>
          </div>
          <div class="pacs-zoom-OSD">
            <span id="pacs-status-line">對照模式 ｜ Zoom: <strong id="pacs-zoom-label" style="color:#38bdf8;">${Math.round(pacsZoom * 100)}%</strong></span>
          </div>
        `;
        updatePacsTransform();
        bindPacsCanvasEvents();
        showToast(`🔍 已於主畫面並排對照「本次影像 (${exam.examDate})」與「歷史影像 (${h.date})」`);
      } else {
        renderPacsViewport(exam);
      }

      // 同步更新預覽框按鈕狀態
      selectedHistoryIndex = null;
      previewHistoryReport(idx);
    }

    function applyHistoryReport(idx) {
      const exam = exams.find(e => e.id === currentExamId);
      if (!exam || !exam.historyReports[idx]) return;
      const h = exam.historyReports[idx];

      Object.entries(h.fields).forEach(([k, v]) => {
        const textarea = document.getElementById("field-" + k);
        if (textarea) textarea.value = v;
        updateFieldDraft(k, v);
      });

      // 若歷史報告之 Diagnosis 含有 BI-RADS 分級，同步勾選 BI-RADS 選擇器
      if (exam.category === "健檢乳攝" && h.fields.Diagnosis) {
        const match = h.fields.Diagnosis.match(/BI-RADS\s*([0-5])/i);
        if (match) {
          selectMammoBirads(match[1], false);
        }
      }
      showToast(`已帶入 ${h.date} 的歷史報告內容！`);
    }

    // 渲染健檢乳攝第三人裁決並排對照面板（兩線都完成且 BI-RADS 不一致時顯示兩線結果）
    function renderMammoDualReadPanel(exam, loginDoc) {
      const container = document.getElementById("mammo-dual-read-container");
      if (!container || exam.category !== "健檢乳攝" || !exam.dualRead) return;

      const assigned = exam.dualRead.assignedReaders || ["醫師甲", "醫師丙"];
      const reports = exam.dualRead.reports || {};
      const docA = assigned[0];
      const docB = assigned[1];
      const repA = reports[docA];
      const repB = reports[docB];

      let arbitrationCompareHtml = "";

      if (exam.reportStatus === "待裁決" && repA && repB) {
        const arbDoc = exam.dualRead.arbitratorDoctor || "醫師乙";
        const isArbitrator = loginDoc === arbDoc;
        const disabledAttr = isArbitrator ? "" : `disabled title="僅限裁決醫師（${arbDoc}）可點擊"`;
        arbitrationCompareHtml = `
          <div class="arbitration-panel">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px;">
              <strong>🔍 兩線獨立判讀醫師結果並排對照（點選按鈕可將該醫師描述帶入下方最終裁決報告）</strong>
            </div>
            <div class="arbitration-grid">
              <div class="reader-compare-card">
                <div>
                  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                    <strong>👤 判讀線 A：${docA}</strong>
                    <span class="badge badge-saved">BI-RADS ${repA.birads}</span>
                  </div>
                  <div><strong>Findings:</strong> ${repA.findings || "（未填寫）"}</div>
                  <div><strong>Diagnosis:</strong> ${repA.diagnosis || "（未填寫）"}</div>
                </div>
                <div>
                  <button type="button" class="btn btn-sm btn-outline" style="width:100%;" onclick="adoptReaderReport('${docA}')" ${disabledAttr}>採納 ${docA}（BI-RADS ${repA.birads}）內容</button>
                </div>
              </div>
              <div class="reader-compare-card">
                <div>
                  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                    <strong>👤 判讀線 B：${docB}</strong>
                    <span class="badge badge-saved">BI-RADS ${repB.birads}</span>
                  </div>
                  <div><strong>Findings:</strong> ${repB.findings || "（未填寫）"}</div>
                  <div><strong>Diagnosis:</strong> ${repB.diagnosis || "（未填寫）"}</div>
                </div>
                <div>
                  <button type="button" class="btn btn-sm btn-outline" style="width:100%;" onclick="adoptReaderReport('${docB}')" ${disabledAttr}>採納 ${docB}（BI-RADS ${repB.birads}）內容</button>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      if (arbitrationCompareHtml) {
        container.classList.remove("hidden");

      } else {
        container.classList.add("hidden");
        container.innerHTML = "";
      }
    }

    function updateDiagnosisBiradsUI() {
      const box = document.getElementById("birads-selector-box");
      if (box) {
        box.innerHTML = BIRADS_OPTIONS.map(opt => {
          const isActive = String(currentMammoBirads) === opt.code ? "active" : "";
          return `
            <button type="button" class="birads-pill ${isActive}" onclick="selectMammoBirads('${opt.code}', true)">
              ${opt.label}
            </button>
          `;
        }).join("");
      }
      const helperEl = document.getElementById("field-helper-Diagnosis");
      if (helperEl) {
        helperEl.innerHTML = `必選分類`;
      }
    }

    function quickSwitchDoctor(targetDoc) {
      const selectEl = document.getElementById("login-doctor");
      if (selectEl) {
        selectEl.value = targetDoc;
        onLoginDoctorChange();
      }
    }

    function selectMammoBirads(code, autoUpdateDiagnosis = true) {
      const exam = exams.find(e => e.id === currentExamId);
      if (!exam || exam.category !== "健檢乳攝") return;

      currentMammoBirads = String(code);
      const diagBlock = document.getElementById("field-block-Diagnosis");
      if (diagBlock) diagBlock.classList.remove("missing-error");

      const opt = BIRADS_OPTIONS.find(o => o.code === String(code));
      if (autoUpdateDiagnosis && opt) {
        const diagEl = document.getElementById("field-Diagnosis");
        if (diagEl) {
          diagEl.value = opt.phrase;
          updateFieldDraft("Diagnosis", opt.phrase);
        }
      }

      // 儲存當前醫師獨立線或裁決階段的 BI-RADS 草稿
      const loginDoc = getCurrentLoginDoctor();
      if (exam.reportStatus === "未完成" || exam.reportStatus === "已完成") {
        if (!exam.dualRead.drafts) exam.dualRead.drafts = {};
        if (!exam.dualRead.drafts[loginDoc]) {
          exam.dualRead.drafts[loginDoc] = { birads: "", Findings: "", Diagnosis: "" };
        }
        exam.dualRead.drafts[loginDoc].birads = currentMammoBirads;
      } else if (exam.reportStatus === "待裁決") {
        if (!exam.dualRead.arbitrationDraft) {
          exam.dualRead.arbitrationDraft = { birads: "", Findings: "", Diagnosis: "" };
        }
        exam.dualRead.arbitrationDraft.birads = currentMammoBirads;
      }

      updateDiagnosisBiradsUI();
      renderMammoDualReadPanel(exam, loginDoc);
    }

    function adoptReaderReport(docName) {
      const exam = exams.find(e => e.id === currentExamId);
      if (!exam || !exam.dualRead || !exam.dualRead.reports) return;
      const loginDoc = getCurrentLoginDoctor();
      const arbDoc = exam.dualRead.arbitratorDoctor || "醫師乙";
      if (loginDoc !== arbDoc) {
        showToast(`⚠️ 僅限裁決醫師（${arbDoc}）可進行裁決，其他醫師不可點選！`);
        return;
      }
      const source = exam.dualRead.reports[docName];
      if (!source) return;

      const fEl = document.getElementById("field-Findings");
      const dEl = document.getElementById("field-Diagnosis");
      if (fEl) fEl.value = source.findings;
      if (dEl) dEl.value = source.diagnosis;

      exam.dualRead.arbitrator = {
        doctor: arbDoc,
        birads: source.birads,
        findings: source.findings,
        diagnosis: source.diagnosis
      };
      exam.reportContent = {
        Findings: source.findings,
        Diagnosis: source.diagnosis
      };
      currentMammoBirads = source.birads;
      exam.reportStatus = "已認證";
      exam.reportDoctor = `${arbDoc} (裁決)`;

      const msg = `已採納 ${docName}（BI-RADS ${source.birads}）的判讀內容並完成裁決認證！`;
      proceedAfterSave(exam, msg);
    }

    function updateActionButtonsForExam(exam, loginDoc) {
      const uncertBtn = document.getElementById("btn-uncertify");
      const quickNormalBtn = document.getElementById("btn-quick-normal-bottom");
      const saveBtn = document.getElementById("btn-save-report");
      const certifyBtn = document.getElementById("btn-certify-report");

      if (exam.reportStatus === "已認證") {
        uncertBtn.classList.remove("hidden");
      } else {
        uncertBtn.classList.add("hidden");
      }

      // 重置為一般檢查單預設按鈕外觀與文字
      quickNormalBtn.classList.remove("hidden");
      saveBtn.classList.remove("hidden");
      certifyBtn.classList.remove("hidden");
      saveBtn.disabled = false;
      certifyBtn.disabled = false;
      quickNormalBtn.disabled = false;
      certifyBtn.className = "btn btn-success";

      if (exam.category === "健檢乳攝" && exam.dualRead) {
        const assigned = exam.dualRead.assignedReaders || ["醫師甲", "醫師丙"];
        const reports = exam.dualRead.reports || {};
        const myReport = reports[loginDoc];
        const otherDoc = assigned.find(d => d !== loginDoc) || "另一線醫師";
        const otherReport = reports[otherDoc];

        if (exam.reportStatus === "未完成" || exam.reportStatus === "已完成") {
          if (!assigned.includes(loginDoc)) {
            quickNormalBtn.innerHTML = "🔒 雙線獨立判讀階段";
            saveBtn.innerHTML = "🔒 非本單雙線判讀醫師";
            certifyBtn.innerHTML = "🔒 待雙線完成後系統自動比對";
            quickNormalBtn.disabled = true;
            saveBtn.disabled = true;
            certifyBtn.disabled = true;
          } else if (myReport) {
            quickNormalBtn.innerHTML = `⚡ 帶入正常 (BI-RADS 1) 並更新 (${loginDoc})`;
            saveBtn.innerHTML = `💾 更新個人獨立判讀 (${loginDoc})`;
            certifyBtn.innerHTML = `⏳ 待 ${otherDoc} 完成後系統自動比對`;
            certifyBtn.disabled = true;
          } else if (otherReport) {
            // 另一線已經完成，本人提交時系統將立即自動比對認證或轉發第三位醫師
            quickNormalBtn.innerHTML = `⚡ 帶入正常並提交 (${loginDoc})`;
            saveBtn.innerHTML = `💾 提交個人判讀（兩線完成自動比對）`;
            certifyBtn.innerHTML = `✅ 提交並觸發系統自動比對`;
            certifyBtn.disabled = false;
          } else {
            // 本人為第一條完成的線，提交後等待另一線完成
            quickNormalBtn.innerHTML = `⚡ 帶入正常並提交 (${loginDoc})`;
            saveBtn.innerHTML = `💾 提交個人獨立判讀 (${loginDoc})`;
            certifyBtn.innerHTML = `🔒 待兩線皆完成後系統自動比對`;
            certifyBtn.disabled = true;
            certifyBtn.title = "兩位判讀醫師各自獨立完成報告後，系統將自動比對 BI-RADS 進行認證或發派給第三位醫師";
          }
        } else if (exam.reportStatus === "待裁決") {
          quickNormalBtn.classList.add("hidden");
          saveBtn.classList.add("hidden");
          certifyBtn.classList.add("hidden");
        } else if (exam.reportStatus === "已認證") {
          quickNormalBtn.innerHTML = "⚡ 帶入正常片語並儲存";
          saveBtn.innerHTML = "💾 儲存";
          certifyBtn.innerHTML = "✅ 已認證";
        }
      } else {
        quickNormalBtn.innerHTML = "⚡ 帶入正常片語並儲存";
        saveBtn.innerHTML = "💾 儲存";
        certifyBtn.innerHTML = "✅ 認證";
      }
    }

    // 上下文列與上下筆清單邏輯（與工作清單的排序方向保持一致）
    function getNavigableQueue() {
      const dontSkipDc = document.getElementById("chk-dont-skip-dc") ? document.getElementById("chk-dont-skip-dc").checked : false;
      const currentDoctorFilter = document.getElementById("filter-doctor").value;

      const list = exams.filter(e => {
        // 永遠跳過未照影像（除非目前正在看的那一筆本身就是未照，保留在序列中定位）
        if (e.id !== currentExamId) {
          if (e.imageStatus === "未照") return false;
          if (!dontSkipDc && e.orderStatus === "已DC") return false;
        }
        if (currentDoctorFilter !== "ALL" && !isExamMatchingDoctorFilter(e, currentDoctorFilter) && e.id !== currentExamId) {
          return false;
        }
        return true;
      });

      list.sort((a, b) => {
        const valA = a[sortField] || "";
        const valB = b[sortField] || "";
        if (valA < valB) return sortAsc ? -1 : 1;
        if (valA > valB) return sortAsc ? 1 : -1;
        return 0;
      });

      return list;
    }

    function renderContextStrip(currentExam) {
      const queue = getNavigableQueue();
      const idx = queue.findIndex(e => e.id === currentExam.id);
      const prevExam = idx > 0 ? queue[idx - 1] : null;
      const nextExam = (idx !== -1 && idx < queue.length - 1) ? queue[idx + 1] : null;

      // 計算剩餘未完成數量
      const remainingPending = queue.filter(e => e.reportStatus === "未完成" && e.imageStatus === "已照").length;
      document.getElementById("report-queue-progress").textContent =
        `佇列位置：第 ${idx + 1} / ${queue.length} 筆（目前佇列剩餘 ${remainingPending} 份未完成）`;

      const stripEl = document.getElementById("report-context-strip");
      stripEl.innerHTML = `
        <button type="button" class="context-pill clickable" onclick="navigateExam(-1)" ${!prevExam ? "disabled" : ""} title="${prevExam ? `點此切換至上一筆：${prevExam.id} ${prevExam.patientName} (${prevExam.examName})` : '目前已是第一筆'}">
          ⬅️ 上一筆：${prevExam ? `${prevExam.id} ${prevExam.patientName} (${prevExam.examName})` : "無"}
        </button>
        <span class="context-pill current" title="目前：${currentExam.id} ${currentExam.patientName} (${currentExam.examName})">
          📍 目前：${currentExam.id} ${currentExam.patientName} (${currentExam.examName})
        </span>
        <button type="button" class="context-pill clickable" onclick="navigateExam(1)" ${!nextExam ? "disabled" : ""} title="${nextExam ? `點此切換至下一筆：${nextExam.id} ${nextExam.patientName} (${nextExam.examName})` : '目前已是最後一筆'}">
          ➡️ 下一筆：${nextExam ? `${nextExam.id} ${nextExam.patientName} (${nextExam.examName})` : "無"}
        </button>
      `;

      document.getElementById("btn-prev-exam").disabled = !prevExam;
      document.getElementById("btn-next-exam").disabled = !nextExam;
    }

    // 一般片語帶入（使用者決定 1：預設帶入文字框，按儲存/認證才跳下一筆；乳攝 Diagnosis 片語同步連動 BI-RADS 選擇器）
    function insertPhrase(fieldKey, phraseText) {
      const exam = exams.find(e => e.id === currentExamId);
      if (!exam) return;

      const textarea = document.getElementById("field-" + fieldKey);
      if (!textarea) return;

      const currentVal = textarea.value.trim();
      if (!currentVal) {
        textarea.value = phraseText;
      } else if (!currentVal.includes(phraseText)) {
        textarea.value = currentVal + " " + phraseText;
      }
      updateFieldDraft(fieldKey, textarea.value);

      if (exam.category === "健檢乳攝" && fieldKey === "Diagnosis") {
        const match = phraseText.match(/BI-RADS\s*([0-5])/i);
        if (match) {
          selectMammoBirads(match[1], false);
        }
      }
      showToast(`已帶入片語至 [${fieldKey}] 欄位`);
    }

    function updateFieldDraft(fieldKey, val) {
      const exam = exams.find(e => e.id === currentExamId);
      if (!exam) return;
      const loginDoc = getCurrentLoginDoctor();

      if (exam.category === "健檢乳攝" && exam.dualRead) {
        const assigned = exam.dualRead.assignedReaders || ["醫師甲", "醫師丙"];
        if ((exam.reportStatus === "未完成" || exam.reportStatus === "已完成") && assigned.includes(loginDoc)) {
          if (!exam.dualRead.drafts) exam.dualRead.drafts = {};
          if (!exam.dualRead.drafts[loginDoc]) {
            exam.dualRead.drafts[loginDoc] = { birads: currentMammoBirads, Findings: "", Diagnosis: "" };
          }
          exam.dualRead.drafts[loginDoc][fieldKey] = val;
          return;
        }
        if (exam.reportStatus === "待裁決") {
          if (!exam.dualRead.arbitrationDraft) {
            exam.dualRead.arbitrationDraft = { birads: currentMammoBirads, Findings: "", Diagnosis: "" };
          }
          exam.dualRead.arbitrationDraft[fieldKey] = val;
          return;
        }
      }
      exam.reportContent[fieldKey] = val;
    }

    // 使用者設計決定 1：快速帶入預設正常片語並完成跳下一筆（支援健檢乳攝自動選定 BI-RADS 1 並推進雙線狀態機）
    function applyDefaultNormalAndNext() {
      const exam = exams.find(e => e.id === currentExamId);
      if (!exam) return;

      const tpl = REPORT_TEMPLATES[exam.category];
      if (tpl) {
        tpl.fields.forEach(field => {
          const textarea = document.getElementById("field-" + field.key);
          if (textarea) textarea.value = field.defaultNormal;
          updateFieldDraft(field.key, field.defaultNormal);
        });
      }

      if (exam.category === "健檢乳攝" && exam.dualRead) {
        selectMammoBirads("1", false);
      }

      saveCurrentReport("已完成", true);
    }

    // 儲存或認證報告，並自動跳到下一筆未完成報告（含變數二健檢乳攝：雙線各自獨立判讀＆兩線完成自動比對或派發第三人裁決）
    function saveCurrentReport(targetStatus, isQuickNormal = false) {
      const exam = exams.find(e => e.id === currentExamId);
      if (!exam) return;
      const loginDoc = getCurrentLoginDoctor();

      // 取得畫面上的 textarea 內容
      const currentFields = {};
      const tpl = REPORT_TEMPLATES[exam.category];
      if (tpl) {
        tpl.fields.forEach(field => {
          const textarea = document.getElementById("field-" + field.key);
          currentFields[field.key] = textarea ? textarea.value.trim() : "";
        });
      }

      // 變數二專屬邏輯：健檢乳攝雙線各自獨立判讀與第三人裁決
      if (exam.category === "健檢乳攝" && exam.dualRead) {
        // 若文字框內已有 BI-RADS N 但尚未點選膠囊，自動解析帶入
        if (currentMammoBirads === "" && currentFields.Diagnosis) {
          const match = currentFields.Diagnosis.match(/BI-RADS\s*([0-5])/i);
          if (match) currentMammoBirads = match[1];
        }

        if (currentMammoBirads === "") {
          const diagBlock = document.getElementById("field-block-Diagnosis");
          if (diagBlock) diagBlock.classList.add("missing-error");
          showToast("⚠️ 健檢乳攝必選 BI-RADS 分類！請先於 Diagnosis 下方點選 BI-RADS 0 ~ 5 再提交判讀。");
          return;
        }

        const assigned = exam.dualRead.assignedReaders || ["醫師甲", "醫師丙"];
        const [docA, docB] = assigned;
        const arbDoc = exam.dualRead.arbitratorDoctor || "醫師乙";
        if (!exam.dualRead.reports) exam.dualRead.reports = {};
        if (!exam.dualRead.drafts) exam.dualRead.drafts = {};

        // 階段 1 & 2：雙線獨立判讀階段（未完成 0/2 或 已完成 1/2）
        if (exam.reportStatus === "未完成" || exam.reportStatus === "已完成") {
          if (!assigned.includes(loginDoc)) {
            showToast(`⚠️ 此筆雙線獨立判讀指派予「${docA}」與「${docB}」，請切換為其中一位判讀醫師提交！`);
            return;
          }

          const wasAlreadySubmitted = Boolean(exam.dualRead.reports[loginDoc]);
          exam.dualRead.reports[loginDoc] = {
            doctor: loginDoc,
            birads: currentMammoBirads,
            findings: currentFields.Findings || "Scattered areas of fibroglandular density.",
            diagnosis: currentFields.Diagnosis || `BI-RADS ${currentMammoBirads}`
          };
          exam.dualRead.drafts[loginDoc] = {
            birads: currentMammoBirads,
            Findings: exam.dualRead.reports[loginDoc].findings,
            Diagnosis: exam.dualRead.reports[loginDoc].diagnosis
          };

          const repA = exam.dualRead.reports[docA];
          const repB = exam.dualRead.reports[docB];

          // 若兩線皆已完成提交 -> 系統自動比對 BI-RADS 分類
          if (repA && repB) {
            if (String(repA.birads) === String(repB.birads)) {
              // 兩線 BI-RADS 分類一致 -> 系統自動完成認證
              exam.reportStatus = "已認證";
              exam.reportDoctor = `${docA} / ${docB}`;
              exam.reportContent = {
                Findings: exam.dualRead.reports[loginDoc].findings,
                Diagnosis: exam.dualRead.reports[loginDoc].diagnosis
              };
              const msg = `✅ 【雙線完成・自動比對一致】線 A（${docA}）與線 B（${docB}）皆為 BI-RADS ${currentMammoBirads}，系統已自動完成認證！`;
              proceedAfterSave(exam, msg);
              return;
            } else {
              // 兩線 BI-RADS 分類不一致 -> 系統自動攔截認證並派發給第三位裁決醫師（醫師乙）
              exam.reportStatus = "待裁決";
              exam.reportDoctor = arbDoc;
              exam.dualRead.arbitrationDraft = {
                birads: "",
                Findings: exam.dualRead.reports[loginDoc].findings || repA.findings,
                Diagnosis: ""
              };
              showToast(`⚖️ 【雙線完成・自動比對不一致】線 A ${docA} (BI-RADS ${repA.birads}) ≠ 線 B ${docB} (BI-RADS ${repB.birads})！系統已自動派發予第三位醫師「${arbDoc}」裁決。`);
              renderReportView();
              return;
            }
          } else {
            // 僅其中一線完成（1/2 已判讀），等待另一線獨立完成
            exam.reportStatus = "已完成";
            exam.reportDoctor = `${docA} / ${docB}`;
            exam.reportContent = {
              Findings: exam.dualRead.reports[loginDoc].findings,
              Diagnosis: exam.dualRead.reports[loginDoc].diagnosis
            };
            const otherDoc = loginDoc === docA ? docB : docA;
            if (wasAlreadySubmitted) {
              showToast(`💾 已更新 ${loginDoc} 的獨立判讀內容（BI-RADS ${currentMammoBirads}），等待另一線「${otherDoc}」完成後由系統自動比對。`);
              renderReportView();
              return;
            } else {
              const msg = `👥 【1/2 獨立線完成】${loginDoc}已提交 BI-RADS ${currentMammoBirads} 並盲讀封存；待另一線「${otherDoc}」完成報告後，系統將自動比對認證或派發裁決！`;
              proceedAfterSave(exam, msg);
              return;
            }
          }
        }

        // 階段 3：雙線比對不一致，第三位醫師裁決
        if (exam.reportStatus === "待裁決") {
          const repA = exam.dualRead.reports[docA];
          const repB = exam.dualRead.reports[docB];
          if (targetStatus === "已完成" && !isQuickNormal) {
            // 僅暫存裁決草稿
            exam.dualRead.arbitrationDraft = {
              birads: currentMammoBirads,
              Findings: currentFields.Findings,
              Diagnosis: currentFields.Diagnosis
            };
            showToast(`💾 已暫存裁決草稿（BI-RADS ${currentMammoBirads}）。`);
            renderReportView();
            return;
          }

          if (assigned.includes(loginDoc)) {
            showToast(`⚠️ 依品質管理規定，原雙線判讀醫師（${loginDoc}）不可自行裁決，請切換為第三位醫師（${arbDoc}）進行裁決認證！`);
            return;
          }

          exam.dualRead.arbitrator = {
            doctor: loginDoc,
            birads: currentMammoBirads,
            findings: currentFields.Findings || (repA ? repA.findings : ""),
            diagnosis: currentFields.Diagnosis || `BI-RADS ${currentMammoBirads}`
          };
          exam.reportContent = {
            Findings: exam.dualRead.arbitrator.findings,
            Diagnosis: exam.dualRead.arbitrator.diagnosis
          };
          exam.reportStatus = "已認證";
          exam.reportDoctor = `${loginDoc} (裁決)`;

          const msg = `⚖️ 【第三人裁決完成】${loginDoc}已裁決最終分類為 BI-RADS ${currentMammoBirads}，報告已正式認證回傳 HIS！`;
          proceedAfterSave(exam, msg);
          return;
        }
      }

      // 一般檢查類別（非健檢乳攝）原有儲存／認證邏輯
      Object.entries(currentFields).forEach(([k, v]) => {
        exam.reportContent[k] = v;
      });
      exam.reportStatus = targetStatus;
      if (exam.reportDoctor === "未指派") {
        exam.reportDoctor = loginDoc;
      }

      const actionLabel = isQuickNormal
        ? `⚡ 已快速帶入正常片語並將 ${exam.id}（${exam.patientName}）設為【${targetStatus}】`
        : `已將 ${exam.id}（${exam.patientName}）報告設為【${targetStatus}】`;

      proceedAfterSave(exam, actionLabel);
    }

    function proceedAfterSave(exam, actionLabel) {
      const nextPending = findNextPendingExam(exam.id);
      if (nextPending) {
        showToast(`${actionLabel}，自動跳轉至下一筆待辦報告：${nextPending.id}（${nextPending.patientName}）`);
        openReport(nextPending.id);
      } else {
        showToast(`${actionLabel}！🎉 目前登入醫師佇列中已無其他待辦報告，返回工作清單。`);
        renderReportView();
        setTimeout(() => {
          backToWorklist();
        }, 1000);
      }
    }

    // 尋找下一筆待辦報告（預設跳過未照與已DC，支援乳攝雙線獨立判讀與裁決待辦，並與工作清單排序方向一致）
    function findNextPendingExam(fromId) {
      const chkSkipEl = document.getElementById("chk-dont-skip-dc");
      const dontSkipDc = chkSkipEl ? chkSkipEl.checked : false;
      const currentDoctorFilter = document.getElementById("filter-doctor").value;
      const loginDoc = getCurrentLoginDoctor();

      const sortedExams = [...exams].sort((a, b) => {
        const valA = a[sortField] || "";
        const valB = b[sortField] || "";
        if (valA < valB) return sortAsc ? -1 : 1;
        if (valA > valB) return sortAsc ? 1 : -1;
        return 0;
      });

      const currentIdx = sortedExams.findIndex(e => e.id === fromId);
      const ordered = [
        ...sortedExams.slice(currentIdx + 1),
        ...sortedExams.slice(0, currentIdx)
      ];

      return ordered.find(e => {
        if (e.id === fromId) return false;
        if (e.imageStatus === "未照") return false; // 未照影像無法打報告，自動跳過
        if (!dontSkipDc && e.orderStatus === "已DC") return false; // 預設跳過已DC，除非勾選不跳過
        if (currentDoctorFilter !== "ALL") {
          return isExamActionableForDoctor(e, loginDoc);
        }
        return isExamActionableForDoctor(e, loginDoc) || e.reportStatus === "未完成" || e.reportStatus === "待裁決";
      });
    }

    // 手動點上一筆 / 下一筆
    function navigateExam(direction) {
      const queue = getNavigableQueue();
      const idx = queue.findIndex(e => e.id === currentExamId);
      if (idx === -1) return;
      const target = queue[idx + direction];
      if (target) {
        openReport(target.id);
      }
    }

    // 取消認證（退回未完成；若為健檢乳攝則重置雙線獨立判讀紀錄重新雙讀）
    function uncertifyCurrentReport() {
      const exam = exams.find(e => e.id === currentExamId);
      if (!exam) return;
      exam.reportStatus = "未完成";
      if (exam.category === "健檢乳攝" && exam.dualRead) {
        exam.dualRead = {
          assignedReaders: ["醫師甲", "醫師丙"],
          arbitratorDoctor: "醫師乙",
          reports: {},
          drafts: {},
          arbitrator: null,
          arbitrationDraft: null
        };
        exam.reportDoctor = "醫師甲 / 醫師丙";
        currentMammoBirads = "";
        showToast(`已取消 ${exam.id} 的認證狀態，乳攝雙線獨立判讀紀錄已重置並退回「未完成」清單。`);
      } else {
        showToast(`已取消 ${exam.id} 的認證狀態，報告已退回「未完成」清單。`);
      }
      renderReportView();
    }

    // F9 開關影像示意區
    function toggleImagePanel() {
      if (isPacsFullscreen && isImageVisible) {
        togglePacsFullscreen();
      }
      isImageVisible = !isImageVisible;
      const pacsPanel = document.getElementById("pacs-panel");
      const splitContainer = document.getElementById("workspace-split-container");
      const topBar = document.getElementById("editor-top-bar");

      if (isImageVisible) {
        pacsPanel.classList.remove("hidden");
        splitContainer.classList.remove("image-collapsed");
        if (topBar) topBar.style.display = "none";
        showToast("已開啟 PACS 影像顯示區 (F9)");
      } else {
        pacsPanel.classList.add("hidden");
        splitContainer.classList.add("image-collapsed");
        if (topBar) topBar.style.display = "flex";
        showToast("已隱藏 PACS 影像顯示區 (按 F9 可再次開啟)");
      }
    }

    // 監聽鍵盤 F9 快捷鍵與 Escape 退出全螢幕
    document.addEventListener("keydown", function(e) {
      const reportViewVisible = !document.getElementById("view-report").classList.contains("hidden");
      if (!reportViewVisible) return;

      if (e.key === "F9") {
        e.preventDefault();
        toggleImagePanel();
      } else if (e.key === "Escape" && isPacsFullscreen) {
        e.preventDefault();
        togglePacsFullscreen();
      }
    });

    function simulateTranslate(mode) {
      if (mode === "zh2en") {
        showToast("🌐 示意功能（中翻英）：已將欄位中的中文描述轉換為英文臨床標準用語。");
      } else {
        showToast("🌐 示意功能（英翻中）：已顯示英文報告內容之中文對照翻譯。");
      }
    }

    function resetAllData() {
      exams = JSON.parse(JSON.stringify(INITIAL_EXAMS));
      clearFilters();
      if (currentExamId) {
        backToWorklist();
      } else {
        renderWorklist();
      }
      showToast("已將所有模擬資料恢復為初始狀態！");
    }

    function showToast(msg) {
      const container = document.getElementById("toast-container");
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.textContent = msg;
      container.appendChild(toast);
      setTimeout(() => {
        toast.remove();
      }, 3200);
    }

    // 初始化
    renderWorklist();
  </script>
</body>
