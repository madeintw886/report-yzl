<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>醫療影像報告系統</title>
  <style>
    /* 依據 report-system-design-tokens (SKILL.md & tokens.css) 定義 */
    :root {
      /* 色彩：原始色票 (Color Palette from Reference Image) */
      --palette-black: #111111;
      --palette-cream: #F7F3EF;
      --palette-yellow: #FFE59A;
      --palette-pink: #FFB5C1;
      --palette-mint: #B7E1D1;
      --palette-blue: #A9D3FF;
      --palette-lavender: #D9C2FF;

      /* 色彩：基本語意變數 */
      --color-primary: #111111;         /* 主色：深炭黑（主要按鈕、重點標題、圖示） */
      --color-accent: #FFE59A;          /* 點綴強調色：暖黃（按鈕內圓形箭頭、高亮區塊） */
      --color-bg: #F7F3EF;              /* 頁面背景色：暖米白 (#F7F3EF) */
      --color-surface: #FFFFFF;         /* 卡片與區塊底色：純白 */
      --color-text: #111111;            /* 主要文字：深炭黑 (#111111) */
      --color-text-muted: #6E6A63;      /* 次要文字：暖深灰 */
      --color-border: #DDD8D0;          /* 一般框線（表單輸入框、卡片分隔線） */
      --color-border-strong: #111111;   /* 強調框線（次要按鈕、Checkbox/Radio 邊框） */

      /* 色彩：報告狀態（對應參考圖 TAG / CHIP 四色色票 + 雙讀裁決薰衣草紫，搭配 #111111 深色文字與圖示） */
      --status-pending: #FFE59A;        /* 未完成：暖黃色 (#FFE59A) */
      --status-done: #A9D3FF;           /* 已完成 / 1/2 已判讀：天空藍 (#A9D3FF) */
      --status-certified: #B7E1D1;      /* 已認證：薄荷綠 (#B7E1D1) */
      --status-dc: #FFB5C1;             /* 醫令已 DC：櫻花粉 (#FFB5C1) */
      --status-arbitration: #D9C2FF;    /* 待裁決（乳攝雙人判讀 BI-RADS 不一致）：薰衣草紫 (#D9C2FF) */

      /* 字體與字級 */
      --font-family: "Noto Sans JP Rounded", "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
      --font-size-sm: 14px;             /* Light: 14 / 24 */
      --font-size-md: 16px;             /* Regular: 16 / 28 */
      --font-size-lg: 20px;             /* Medium: 20 / 32 */
      --font-size-xl: 32px;             /* Bold: 32 / 44 */

      /* 行高與字重 */
      --line-height-sm: 24px;
      --line-height-md: 28px;
      --line-height-lg: 32px;
      --line-height-xl: 44px;
      --font-weight-light: 300;
      --font-weight-regular: 400;
      --font-weight-medium: 500;
      --font-weight-bold: 700;

      /* 間距 */
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-6: 24px;

      /* 圓角 */
      --radius: 12px;                   /* 一般元件與表單欄位圓角 */
      --radius-card: 20px;              /* 區塊卡片圓角 */
      --radius-pill: 9999px;            /* 膠囊形按鈕與狀態標籤 (Tag/Chip) */

      /* 內部相容與延伸衍生色 */
      --primary: var(--color-primary);
      --primary-hover: #2b2b2b;
      --primary-light: #FFF8DF;
      --accent: var(--color-accent);
      --accent-hover: #ffd966;
      --bg-page: var(--color-bg);
      --bg-surface: var(--color-surface);
      --bg-muted: #F7F3EF;
      --text-main: var(--color-text);
      --text-secondary: #45423E;
      --text-muted: var(--color-text-muted);
      --border: var(--color-border);
      --border-light: #EAE5DC;

      --status-pending-bg: var(--status-pending);
      --status-pending-row: #FFFDF5;
      --status-pending-text: var(--color-text);
      --status-pending-border: #E5C76B;

      --status-saved-bg: var(--status-done);
      --status-saved-row: #F4F9FF;
      --status-saved-text: var(--color-text);
      --status-saved-border: #7AB8F5;

      --status-certified-bg: var(--status-certified);
      --status-certified-row: #F2FAF6;
      --status-certified-text: var(--color-text);
      --status-certified-border: #82C7AE;

      --status-dc-bg: var(--status-dc);
      --status-dc-row: #FFF5F7;
      --status-dc-text: var(--color-text);
      --status-dc-border: #F08FA0;

      --status-arbitration-bg: var(--status-arbitration);
      --status-arbitration-row: #F7F2FF;
      --status-arbitration-border: #B695F8;

      --status-img-bg: #E6E2DC;
      --status-img-border: #CFC9C0;

      --status-noimg-bg: #E2D5F8;
      --status-noimg-row: #F8F4FF;
      --status-noimg-text: var(--color-text-muted);
      --status-noimg-border: #BFA8E8;

      --status-unassigned-bg: #FFD8B5;
      --status-unassigned-border: #F2B37E;

      --radius-sm: 10px;
      --radius-md: var(--radius);
      --radius-lg: var(--radius-card);
      --shadow-sm: 0 2px 8px rgba(17, 17, 17, 0.04);
      --shadow-md: 0 6px 18px rgba(17, 17, 17, 0.07);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--color-bg);
      color: var(--color-text);
      line-height: var(--line-height-sm);
      font-size: var(--font-size-sm);
    }

    /* 頂部導覽列 */
    .app-header {
      background-color: var(--color-surface);
      color: var(--color-text);
      padding: var(--space-3) var(--space-6);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--color-border);
      box-shadow: var(--shadow-sm);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }

    .brand-title {
      font-size: var(--font-size-lg);
      line-height: var(--line-height-lg);
      font-weight: var(--font-weight-bold);
      letter-spacing: 0.3px;
      color: var(--color-text);
    }

    .role-badge {
      background-color: var(--color-accent);
      color: var(--color-text);
      font-size: 13px;
      font-weight: var(--font-weight-bold);
      padding: 4px 14px;
      border-radius: var(--radius-pill);
      border: 1.5px solid var(--color-border-strong);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      font-size: var(--font-size-sm);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      background: var(--color-bg);
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--color-border);
    }

    /* 膠囊形按鈕系統 (Primary / Secondary / Status Pill Buttons) */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 7px 16px;
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-bold);
      font-family: var(--font-family);
      border-radius: var(--radius-pill);
      border: 1.5px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-primary {
      background-color: var(--color-primary);
      color: #FFFFFF;
      border-color: var(--color-primary);
    }

    .btn-primary:hover:not(:disabled) {
      background-color: #2c2c2c;
      transform: translateY(-1px);
    }

    .btn-accent {
      background-color: var(--color-accent);
      color: var(--color-text);
      border-color: var(--color-border-strong);
    }

    .btn-accent:hover:not(:disabled) {
      background-color: #ffdc73;
      transform: translateY(-1px);
    }

    .btn-saved {
      background-color: var(--status-saved-bg);
      color: var(--color-text);
      border-color: var(--color-border-strong);
    }

    .btn-saved:hover:not(:disabled) {
      background-color: #8bc2ff;
      transform: translateY(-1px);
    }

    .btn-success {
      background-color: var(--status-certified);
      color: var(--color-text);
      border-color: var(--color-border-strong);
    }

    .btn-success:hover:not(:disabled) {
      background-color: #9cd6c0;
      transform: translateY(-1px);
    }

    .btn-outline {
      background-color: var(--color-surface);
      color: var(--color-text);
      border-color: var(--color-border-strong);
    }

    .btn-outline:hover:not(:disabled) {
      background-color: var(--color-bg);
    }

    .btn-warning-outline {
      background-color: var(--status-dc);
      color: var(--color-text);
      border-color: var(--color-border-strong);
    }

    .btn-warning-outline:hover:not(:disabled) {
      background-color: #ffa0b0;
    }

    .btn-arbitration {
      background-color: var(--status-arbitration);
      color: var(--color-text);
      border-color: var(--color-border-strong);
    }

    .btn-arbitration:hover:not(:disabled) {
      background-color: #c8a6ff;
      transform: translateY(-1px);
    }

    /* 健檢乳攝雙人判讀、盲讀保護與第三人裁決專用元件 */
    .dual-read-banner {
      padding: 10px 14px;
      border-radius: var(--radius);
      border: 1.5px solid var(--color-border-strong);
      margin-bottom: var(--space-3);
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .dual-read-banner.stage-1 {
      background: #FFF9E6;
    }

    .dual-read-banner.stage-2-blind {
      background: #F4F9FF;
    }

    .dual-read-banner.stage-arbitration {
      background: var(--status-arbitration);
    }

    .dual-read-banner.stage-done {
      background: #F2FAF6;
    }

    .birads-selector-box {
      margin-bottom: var(--space-3);
      padding: 10px 14px;
      background: var(--color-bg);
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-card);
    }

    .birads-selector-box.missing-error {
      border-color: var(--color-border-strong);
      background: #FFF5F7;
    }

    .birads-options {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    .birads-pill {
      padding: 5px 12px;
      border-radius: var(--radius-pill);
      border: 1.5px solid var(--color-border-strong);
      background: var(--color-surface);
      color: var(--color-text);
      font-size: 12.5px;
      font-weight: var(--font-weight-bold);
      font-family: var(--font-family);
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .birads-pill:hover {
      background: var(--color-accent);
    }

    .birads-pill.active {
      background: var(--color-primary);
      color: var(--color-accent);
      border-color: var(--color-primary);
    }

    .arbitration-panel {
      margin-bottom: var(--space-3);
      padding: 12px 14px;
      background: #F7F2FF;
      border: 1.5px solid var(--color-border-strong);
      border-radius: var(--radius-card);
    }

    .arbitration-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 8px;
    }

    @media (max-width: 768px) {
      .arbitration-grid {
        grid-template-columns: 1fr;
      }
    }

    .reader-compare-card {
      background: var(--color-surface);
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius);
      padding: 10px 12px;
      font-size: 12.5px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
    }

    .btn-sm {
      padding: 4px 12px;
      font-size: 13px;
    }

    .container {
      max-width: 1440px;
      margin: 0 auto;
      padding: var(--space-4) var(--space-6);
    }

    /* 通知 Toast */
    .toast-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toast {
      background-color: var(--color-primary);
      color: #ffffff;
      padding: 12px 18px;
      border-radius: var(--radius-pill);
      box-shadow: var(--shadow-md);
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-medium);
      border: 2px solid var(--color-accent);
      animation: slideIn 0.2s ease-out;
    }

    @keyframes slideIn {
      from { transform: translateY(15px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* ==================== 畫面一：醫師工作清單 ==================== */
    .summary-banner {
      background: var(--color-surface);
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-card);
      padding: 8px 14px;
      margin-bottom: var(--space-3);
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: nowrap;
      gap: 10px;
      white-space: nowrap;
      overflow-x: auto;
    }

    .summary-title-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .summary-title {
      font-size: 15px;
      font-weight: var(--font-weight-bold);
      color: var(--color-text);
    }

    .count-toggles {
      display: inline-flex;
      align-items: center;
      flex-wrap: nowrap;
      gap: 10px;
      font-size: 12.5px;
      color: var(--text-secondary);
      background: var(--color-bg);
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--color-border);
      flex-shrink: 0;
    }

    .count-toggles label {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      user-select: none;
    }

    .summary-cards {
      display: inline-flex;
      flex-wrap: nowrap;
      gap: 6px;
      align-items: center;
      flex: 1;
    }

    .stat-card {
      background: var(--color-bg);
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius);
      padding: 4px 10px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      flex-direction: row;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      font-size: 13px;
      line-height: 1.3;
    }

    .stat-card:hover {
      border-color: var(--color-border-strong);
      background: #FFF9E6;
    }

    .stat-card.active {
      border: 1.5px solid var(--color-border-strong);
      background: var(--color-accent);
    }

    .stat-card.total-card {
      background: var(--color-primary);
      color: #ffffff;
      border-color: var(--color-primary);
    }

    .stat-card.total-card .stat-label {
      color: var(--color-accent);
    }

    .stat-card.total-card .stat-num,
    .stat-card.total-card .stat-unit {
      color: #ffffff;
    }

    .stat-label {
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-bold);
      color: var(--text-secondary);
    }

    .stat-num {
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-bold);
      color: var(--color-text);
    }

    .stat-unit {
      font-size: var(--font-size-sm);
      opacity: 0.9;
    }

    /* 搜尋與篩選區（與工作清單表格合併於同一卡片） */
    .filter-panel {
      background: var(--color-surface);
      border-bottom: 1px solid var(--border-light);
      padding: 8px 14px;
    }

    .filter-grid {
      display: flex;
      flex-wrap: nowrap;
      gap: 10px;
      align-items: flex-end;
      overflow-x: auto;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      min-width: 105px;
    }

    .form-group label {
      font-size: 13px;
      font-weight: var(--font-weight-bold);
      color: var(--text-secondary);
      white-space: nowrap;
      text-align: center;
    }

    .form-control {
      padding: 6px 8px;
      font-size: var(--font-size-sm);
      font-family: var(--font-family);
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius);
      background-color: var(--color-surface);
      color: var(--color-text);
      transition: border-color 0.15s;
      width: 100%;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--color-border-strong);
      box-shadow: 0 0 0 3px rgba(255, 229, 154, 0.5);
    }

    .visibility-toggles {
      display: inline-flex;
      align-items: center;
      flex-wrap: nowrap;
      gap: 10px;
      font-size: 12.5px;
      color: var(--text-secondary);
      background: var(--color-bg);
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--color-border);
      flex-shrink: 0;
      white-space: nowrap;
    }

    .visibility-toggles label {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      user-select: none;
    }

    /* 工作清單表格 */
    .table-card {
      background: var(--color-surface);
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-card);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .table-toolbar {
      padding: 8px 14px;
      background: var(--color-surface);
      border-bottom: 1.5px solid var(--color-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: nowrap;
      gap: 12px;
      white-space: nowrap;
      overflow-x: auto;
    }

    .legend-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      flex-wrap: nowrap;
      white-space: nowrap;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--color-border);
      font-weight: var(--font-weight-medium);
      color: var(--color-text);
    }

    .table-responsive {
      overflow-x: auto;
    }

    table.worklist-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: var(--font-size-sm);
    }

    table.worklist-table th {
      background: var(--color-bg);
      color: var(--color-text);
      font-weight: var(--font-weight-bold);
      padding: 12px;
      border-bottom: 1.5px solid var(--color-border);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      transition: background 0.12s;
      text-align: center;
    }

    table.worklist-table th:hover {
      background: var(--color-accent);
      color: var(--color-text);
    }

    table.worklist-table td {
      padding: 11px 12px;
      border-bottom: 1px solid var(--border-light);
      vertical-align: middle;
    }

    table.worklist-table tbody tr {
      cursor: pointer;
      transition: all 0.12s ease;
    }

    table.worklist-table tbody tr:hover {
      filter: brightness(0.96);
    }

    /* 依狀態呈現不同底色 */
    tr.row-status-pending { background-color: var(--status-pending-row); }
    tr.row-status-saved { background-color: var(--status-saved-row); }
    tr.row-status-arbitration { background-color: var(--status-arbitration-row); }
    tr.row-status-certified { background-color: var(--status-certified-row); }
    tr.row-status-dc { background-color: var(--status-dc-row); }
    tr.row-status-noimg { background-color: var(--status-noimg-row); color: var(--text-muted); }

    /* 狀態標籤 Badge（對應參考圖 TAG / CHIP：膠囊圓角 + 粉彩色票 + #111111 文字與圖示） */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 12px;
      border-radius: var(--radius-pill);
      font-size: 12.5px;
      font-weight: var(--font-weight-bold);
      white-space: nowrap;
      border: 1px solid rgba(17, 17, 17, 0.2);
      color: var(--color-text);
    }

    .badge-pending {
      background-color: var(--status-pending);
      color: var(--color-text);
    }

    .badge-saved {
      background-color: var(--status-done);
      color: var(--color-text);
    }

    .badge-arbitration {
      background-color: var(--status-arbitration);
      color: var(--color-text);
      border-color: var(--color-border-strong);
    }

    .badge-certified {
      background-color: var(--status-certified);
      color: var(--color-text);
    }

    .badge-dc {
      background-color: var(--status-dc);
      color: var(--color-text);
    }

    .badge-img {
      background-color: var(--status-img-bg);
      color: var(--color-text);
    }

    .badge-noimg {
      background-color: var(--status-noimg-bg);
      color: var(--color-text);
    }

    .badge-unassigned {
      background-color: var(--status-unassigned-bg);
      color: var(--color-text);
    }

    .badge-ok {
      background-color: var(--color-bg);
      color: var(--color-text);
      border-color: var(--color-border);
    }

    /* ==================== 畫面二：打報告畫面 ==================== */
    .hidden {
      display: none !important;
    }

    .report-top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: nowrap;
      gap: 10px;
      margin-bottom: var(--space-3);
      background: var(--color-surface);
      padding: 10px 14px;
      border-radius: var(--radius-card);
      border: 1.5px solid var(--color-border);
      white-space: nowrap;
      overflow-x: auto;
    }

    .context-strip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-wrap: nowrap;
      white-space: nowrap;
      font-size: 13px;
      flex-shrink: 0;
    }

    .context-pill {
      display: inline-block;
      max-width: 280px;
      overflow: hidden;
      text-overflow: ellipsis;
      vertical-align: middle;
      padding: 4px 12px;
      border-radius: var(--radius-pill);
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      color: var(--text-secondary);
      font-family: var(--font-family);
      font-size: 13px;
      transition: all 0.15s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .context-pill.clickable {
      cursor: pointer;
    }

    .context-pill.clickable:hover:not(:disabled) {
      border-color: var(--color-border-strong);
      background: #FFF9E6;
      color: var(--color-text);
    }

    .context-pill:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .context-pill.current {
      background: var(--color-accent);
      border: 1.5px solid var(--color-border-strong);
      color: var(--color-text);
      font-weight: var(--font-weight-bold);
    }

    /* 打報告主卡片（整合病人資訊、影像系統、過去影像及報告、打報告欄位） */
    .report-main-card {
      background: var(--color-surface);
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-card);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    /* 個案必要資訊與 HIS 資訊區 */
    .patient-banner {
      background: var(--color-surface);
      border-bottom: 1.5px solid var(--color-border);
      padding: 12px 18px;
    }

    .patient-grid {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px 14px;
      font-size: var(--font-size-sm);
    }

    .info-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .info-label {
      color: var(--color-text-muted);
      font-weight: var(--font-weight-medium);
      white-space: nowrap;
    }

    .info-value {
      font-weight: var(--font-weight-bold);
      color: var(--color-text);
      white-space: nowrap;
    }

    .his-box {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--color-border);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
      background: var(--color-bg);
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 13px;
    }

    /* 主工作區：左側影像 + 右側報告欄位（合併於同一張卡片內，加入 minmax(0, Xfr) 防止內容撐破截斷） */
    .workspace-split {
      display: grid;
      grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
      gap: 0;
      align-items: stretch;
    }

    .workspace-split.image-collapsed {
      grid-template-columns: 1fr;
    }

    @media (max-width: 1024px) {
      .workspace-split {
        grid-template-columns: 1fr;
      }
    }

    /* 左側：影像示意區與歷史報告查詢 */
    .pacs-panel {
      background: var(--color-surface);
      color: var(--color-text);
      padding: var(--space-4);
      border-right: 1.5px solid var(--color-border);
      transition: all 0.2s ease;
      min-width: 0;
    }

    /* 全螢幕檢視模式 */
    .pacs-panel.pacs-fullscreen {
      position: fixed;
      inset: 0;
      z-index: 5000;
      border-radius: 0;
      padding: 18px 24px;
      display: flex;
      flex-direction: column;
      background: #090d16;
      overflow-y: auto;
    }

    .pacs-panel.pacs-fullscreen .pacs-viewport {
      flex: 1;
      min-height: 520px;
    }

    .pacs-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid #334155;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pacs-viewport {
      background: #020617;
      border: 2px solid #334155;
      border-radius: var(--radius-sm);
      min-height: 330px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      text-align: center;
      position: relative;
      overflow: hidden;
      user-select: none;
    }

    .pacs-canvas-stage {
      width: 100%;
      height: 100%;
      min-height: 260px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: grab;
      transition: transform 0.08s ease-out;
      transform-origin: center center;
    }

    .pacs-canvas-stage.dragging {
      cursor: grabbing;
      transition: none;
    }

    .pacs-overlay-info {
      position: absolute;
      top: 10px;
      left: 12px;
      text-align: left;
      font-size: 11.5px;
      color: #38bdf8;
      background: rgba(15, 23, 42, 0.78);
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid rgba(56, 189, 248, 0.25);
      pointer-events: none;
      z-index: 10;
      line-height: 1.4;
    }

    .pacs-zoom-OSD {
      position: absolute;
      top: 10px;
      right: 12px;
      text-align: right;
      background: rgba(15, 23, 42, 0.78);
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid rgba(56, 189, 248, 0.25);
      font-size: 11.5px;
      color: #cbd5e1;
      pointer-events: none;
      z-index: 10;
      line-height: 1.4;
    }

    .pacs-placeholder-icon {
      font-size: 42px;
      margin-bottom: 8px;
    }

    .pacs-toolbar {
      display: flex;
      gap: 5px;
      flex-wrap: nowrap;
      margin-top: 10px;
      align-items: center;
      justify-content: space-between;
      white-space: nowrap;
      overflow-x: auto;
    }

    .btn-dark {
      background: #262626;
      color: #f8fafc;
      border: 1px solid #404040;
      font-size: 12px;
      padding: 4px 8px;
      gap: 3px;
      border-radius: var(--radius-pill);
      flex: 1;
      min-width: 0;
    }

    .btn-dark:hover {
      background: #3a3a3a;
      border-color: var(--color-accent);
    }

    .btn-dark.active-fullscreen {
      background: var(--color-accent);
      border-color: var(--color-primary);
      color: var(--color-text);
    }

    /* 影像順序調整面板（真實拖曳與前後調序功能） */
    .pacs-reorder-panel {
      margin-top: 10px;
      background: #161d2a;
      border: 1px solid #334155;
      border-radius: var(--radius);
      padding: 10px 12px;
      color: #e2e8f0;
      font-size: 12px;
    }

    .reorder-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      gap: 8px;
      flex-wrap: wrap;
    }

    .series-thumb-list {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .series-thumb-card {
      background: #0b111e;
      border: 1.5px solid #334155;
      border-radius: 8px;
      padding: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      user-select: none;
    }

    .series-thumb-card:hover {
      border-color: #38bdf8;
    }

    .series-thumb-card.active {
      border-color: var(--color-accent);
      background: #1e293b;
      box-shadow: 0 0 0 1px var(--color-accent);
    }

    .series-thumb-card.dragging-thumb {
      opacity: 0.45;
      border-style: dashed;
    }

    .thumb-move-btns {
      display: inline-flex;
      gap: 4px;
      margin-top: 5px;
    }

    .thumb-move-btn {
      background: #263244;
      color: #cbd5e1;
      border: 1px solid #475569;
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 11px;
      cursor: pointer;
    }

    .thumb-move-btn:hover:not(:disabled) {
      background: var(--color-accent);
      color: #111111;
      border-color: #111111;
    }

    .thumb-move-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* 過去影像含報告查詢區（直接呈現在畫面上，不藏在選單） */
    .history-panel {
      background: var(--color-surface);
      color: var(--color-text);
      border-top: 1px solid var(--border-light);
      padding-top: var(--space-3);
      margin-top: var(--space-3);
    }

    .history-title {
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-bold);
      margin-bottom: var(--space-2);
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--color-text);
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .history-item {
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius);
      padding: 8px 12px;
      font-size: 13px;
      background: var(--color-bg);
      cursor: pointer;
      transition: all 0.12s;
    }

    .history-item:hover, .history-item.active {
      border-color: var(--color-border-strong);
      background: var(--color-accent);
    }

    .history-preview {
      margin-top: var(--space-2);
      padding: 10px 12px;
      background: var(--color-bg);
      border: 1.5px solid var(--color-border-strong);
      border-radius: var(--radius);
      font-size: 13px;
    }

    /* 右側：報告撰寫與片語區 */
    .editor-panel {
      background: var(--color-surface);
      padding: var(--space-4);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      min-width: 0;
    }

    .editor-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding-bottom: var(--space-3);
      margin-bottom: var(--space-4);
      border-bottom: 1.5px solid var(--border-light);
    }

    .template-badge {
      background: var(--palette-blue);
      color: var(--color-text);
      padding: 5px 14px;
      border-radius: var(--radius-pill);
      border: 1.5px solid var(--color-border-strong);
      font-weight: var(--font-weight-bold);
      font-size: var(--font-size-sm);
    }

    .quick-tools-bar {
      display: flex;
      gap: var(--space-2);
      flex-wrap: wrap;
      align-items: center;
    }

    .field-block {
      margin-bottom: var(--space-4);
      padding: var(--space-4);
      background: var(--color-bg);
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-card);
    }

    .field-block.missing-error {
      border-color: var(--color-border-strong);
      background: #FFF5F7;
    }

    .field-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-2);
      flex-wrap: wrap;
      gap: 6px;
    }

    .field-name {
      font-size: var(--font-size-md);
      line-height: var(--line-height-md);
      font-weight: var(--font-weight-bold);
      color: var(--color-text);
    }

    .phrase-group {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
      margin-bottom: var(--space-2);
    }

    .phrase-chip {
      background: var(--color-surface);
      border: 1.5px solid var(--color-border-strong);
      color: var(--color-text);
      padding: 5px 14px;
      border-radius: var(--radius-pill);
      font-size: 13px;
      font-weight: var(--font-weight-medium);
      font-family: var(--font-family);
      cursor: pointer;
      transition: all 0.12s;
      text-align: left;
    }

    .phrase-chip:hover {
      background: var(--color-accent);
      border-color: var(--color-border-strong);
      transform: translateY(-1px);
    }

    .report-textarea {
      width: 100%;
      min-height: 82px;
      padding: 12px;
      font-size: var(--font-size-md);
      line-height: var(--line-height-md);
      font-family: "Consolas", "Monaco", var(--font-family), monospace;
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius);
      resize: vertical;
      background: var(--color-surface);
      color: var(--color-text);
      transition: border-color 0.15s;
    }

    .report-textarea:focus {
      outline: none;
      border-color: var(--color-border-strong);
      box-shadow: 0 0 0 3px rgba(255, 229, 154, 0.5);
    }

    /* 底部操作與跳轉控制列 */
    .editor-action-bar {
      margin-top: var(--space-4);
      padding: 8px 12px;
      border: 1.5px solid var(--color-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px 8px;
      background: var(--color-bg);
      border-radius: var(--radius-card);
    }

    .editor-action-bar .btn {
      padding: 6px 12px;
      font-size: 13px;
    }

    .action-buttons-left, .action-buttons-right {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .skip-settings {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      font-size: 13px;
      color: var(--text-secondary);
      width: 100%;
      padding-top: var(--space-2);
      border-top: 1px dashed var(--color-border);
    }

    .skip-settings label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      user-select: none;
    }

    .warning-banner {
      background: var(--status-dc);
      border: 1.5px solid var(--color-border-strong);
      color: var(--color-text);
      padding: 10px 16px;
      border-radius: var(--radius-card);
      margin-bottom: var(--space-3);
      font-weight: var(--font-weight-bold);
      font-size: var(--font-size-sm);
    }
  </style>
</head>
<body>

  <!-- 頂部導覽列 -->
  <header class="app-header">
    <div class="brand-group">
      <span class="brand-title">醫療影像報告系統</span>
      <span class="role-badge">變數二全面調整：乳攝雙人獨立盲讀＆第三人裁決</span>
    </div>
    <div class="header-right">
      <div class="user-info" style="display: inline-flex; align-items: center; gap: 6px;">
        <span>登入者：</span>
        <select id="login-doctor" class="form-control" style="width: auto; padding: 4px 10px; font-weight: 700;" onchange="onLoginDoctorChange()">
          <option value="醫師甲" selected>醫師甲</option>
          <option value="醫師丙">醫師丙</option>
          <option value="醫師乙">醫師乙</option>
        </select>
      </div>
    </div>
  </header>

  <main class="container">

    <!-- ==================== 視圖 1：醫師工作清單 ==================== -->
    <section id="view-worklist">

      <!-- 1. 待完成報告分項數量與總數量看板（置頂單行呈現） -->
      <div class="summary-banner">
        <div class="summary-title-group">
          <span class="summary-title">未完成報告統計</span>
        </div>
        <div class="summary-cards" id="summary-cards-container">
          <!-- 由 JS 動態產生總數與各檢查類別分項數量 -->
        </div>
        <!-- 使用者設計決定 3：讓醫師選擇未完成數量是否計入已DC、未照、未指派 -->
        <div class="count-toggles">
          <strong>計入:</strong>
          <label>
            <input type="checkbox" id="chk-count-dc" onchange="renderWorklist()">
            醫令已 DC
          </label>
          <label>
            <input type="checkbox" id="chk-count-noimg" onchange="renderWorklist()">
            未照影像
          </label>
          <label>
            <input type="checkbox" id="chk-count-otherdoc" onchange="renderWorklist()">
            未指派／其他醫師
          </label>
        </div>
      </div>

      <!-- 2. 搜尋與篩選條件列 + 工作清單表格（合併為單一卡片） -->
      <div class="table-card">
        <div class="filter-panel">
          <div class="filter-grid">
            <div class="form-group">
              <label for="filter-doctor">報告醫師</label>
              <select id="filter-doctor" class="form-control" onchange="renderWorklist()">
                <option value="醫師甲" selected>醫師甲</option>
                <option value="ALL">全部報告醫師</option>
                <option value="未指派">未指派</option>
                <option value="醫師丙">醫師丙</option>
                <option value="醫師乙">醫師乙</option>
              </select>
            </div>

            <div class="form-group" style="flex: 1.9; min-width: 235px;">
              <label for="filter-date-type">日期查詢依據 & 日期</label>
              <div style="display: flex; gap: 4px;">
                <select id="filter-date-type" class="form-control" style="width: 53%; min-width: 118px;" onchange="renderWorklist()">
                  <option value="exam">依檢查日期</option>
                  <option value="order">依開單日期</option>
                </select>
                <select id="filter-date" class="form-control" style="width: 47%; min-width: 108px;" onchange="renderWorklist()">
                  <option value="ALL">全部日期</option>
                  <option value="2026-11-02">2026-11-02</option>
                  <option value="2026-11-03">2026-11-03</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label for="filter-status">報告狀態</label>
              <select id="filter-status" class="form-control" onchange="renderWorklist()">
                <option value="ALL">全部狀態</option>
                <option value="未完成">⏳ 未完成</option>
                <option value="已完成">💾 已完成 / 👥 1/2 已判讀</option>
                <option value="待裁決">⚖️ 待裁決（雙讀不一致）</option>
                <option value="已認證">✅ 已認證</option>
              </select>
            </div>

            <div class="form-group">
              <label for="filter-category">檢查類別</label>
              <select id="filter-category" class="form-control" onchange="renderWorklist()">
                <option value="ALL">全部檢查類別</option>
                <option value="健檢胸部X光">健檢胸部X光</option>
                <option value="健檢乳攝">健檢乳攝</option>
                <option value="門診放射">門診放射</option>
                <option value="心臟超音波">心臟超音波</option>
                <option value="頸動脈超音波">頸動脈超音波</option>
              </select>
            </div>

            <div class="form-group">
              <label for="filter-dept">開單單位</label>
              <select id="filter-dept" class="form-control" onchange="renderWorklist()">
                <option value="ALL">全部開單單位</option>
                <option value="健檢中心">健檢中心</option>
                <option value="肝膽腸胃科">肝膽腸胃科</option>
                <option value="家醫科">家醫科</option>
                <option value="心臟內科">心臟內科</option>
                <option value="神經內科">神經內科</option>
              </select>
            </div>

            <div class="form-group">
              <label for="filter-order-doc">開單醫師</label>
              <select id="filter-order-doc" class="form-control" onchange="renderWorklist()">
                <option value="ALL">全部開單醫師</option>
                <option value="醫師丁">醫師丁</option>
                <option value="醫師戊">醫師戊</option>
                <option value="醫師己">醫師己</option>
                <option value="醫師庚">醫師庚</option>
                <option value="醫師辛">醫師辛</option>
              </select>
            </div>

            <div class="form-group" style="flex: 1.3; min-width: 150px;">
              <label for="filter-keyword">單號 / 身分證字號 / 姓名</label>
              <input type="text" id="filter-keyword" class="form-control" placeholder="輸入 R0001 或 TEST..." oninput="renderWorklist()">
            </div>

            <button class="btn btn-sm btn-outline" onclick="clearFilters()" style="height: 35px; white-space: nowrap; flex-shrink: 0;">清除篩選條件</button>
          </div>
        </div>

        <div class="table-toolbar">
          <div style="display: inline-flex; align-items: center; gap: 8px;">
            <strong>檢查工作清單</strong>
            <span id="worklist-result-count" style="color: var(--text-secondary); font-size: 12.5px;"></span>
          </div>
          <div style="display: inline-flex; align-items: center; gap: 16px;">
            <div class="legend-group">

            label: "Findings",
            phrases: [
              "No significant plaque or hemodynamic stenosis in bilateral carotid arteries.",
              "Mild intima-media thickening in bilateral CCA."
            ],
            defaultNormal: "No significant plaque or hemodynamic stenosis in bilateral carotid arteries."
          },
          {
            key: "Impression",
            label: "Impression",
            phrases: [
              "No significant abnormality."
            ],
            defaultNormal: "No significant abnormality."
          }
        ]
      }
    };

    const ALL_CATEGORIES = ["健檢胸部X光", "健檢乳攝", "門診放射", "心臟超音波", "頸動脈超音波"];

    const BIRADS_OPTIONS = [
      { code: "0", label: "BI-RADS 0", phrase: "BI-RADS 0: Incomplete, need additional imaging evaluation." },
      { code: "1", label: "BI-RADS 1", phrase: "BI-RADS 1: Negative." },
      { code: "2", label: "BI-RADS 2", phrase: "BI-RADS 2: Benign finding." },
      { code: "3", label: "BI-RADS 3", phrase: "BI-RADS 3: Probably benign finding, short-interval follow-up suggested." },
      { code: "4", label: "BI-RADS 4", phrase: "BI-RADS 4: Suspicious abnormality, biopsy should be considered." },
      { code: "5", label: "BI-RADS 5", phrase: "BI-RADS 5: Highly suggestive of malignancy." }
    ];

    // 狀態變數
    let exams = JSON.parse(JSON.stringify(INITIAL_EXAMS));
    let sortField = "examDateTime";
    let sortAsc = false;
    let currentExamId = null;
    let selectedHistoryIndex = null;
    let isImageVisible = true;
    let currentMammoBirads = "";

    // 判斷檢查單是否為「目前登入醫師待辦（含乳攝雙線各自獨立判讀、第三人裁決）」
    function isExamActionableForDoctor(exam, doc) {
      if (exam.category === "健檢乳攝" && exam.dualRead) {
        const assigned = exam.dualRead.assignedReaders || ["醫師甲", "醫師丙"];
        const reports = exam.dualRead.reports || {};
        if (exam.reportStatus === "未完成" || exam.reportStatus === "已完成") {
          // 雙線獨立判讀：只要該醫師在指派雙線名單中，且該醫師自己的那條線尚未提交，即為待辦
          return assigned.includes(doc) && !reports[doc];
        }
        if (exam.reportStatus === "待裁決") {
          return doc === (exam.dualRead.arbitratorDoctor || "醫師乙");
        }
        return false;
      }
      return exam.reportStatus === "未完成" && exam.reportDoctor === doc;
    }

    function getReportStatusBadgeHtml(exam) {
      if (exam.category === "健檢乳攝" && exam.dualRead) {
        const reports = exam.dualRead.reports || {};
        const doneCount = Object.keys(reports).length;
        if (exam.reportStatus === "未完成") {
          return `<span class="badge badge-pending">⏳ 未完成</span>`;
        }
        if (exam.reportStatus === "已完成") {
          return `<span class="badge badge-saved">👥 ${doneCount}/2 已判讀</span>`;
        }
        if (exam.reportStatus === "待裁決") {
          return `<span class="badge badge-arbitration">⚖️ 待裁決</span>`;
        }
        if (exam.reportStatus === "已認證") {
          return `<span class="badge badge-certified">✅ 已認證</span>`;
        }
      }
      if (exam.reportStatus === "已完成") {
        return `<span class="badge badge-saved">💾 已完成</span>`;
      }
      if (exam.reportStatus === "待裁決") {
        return `<span class="badge badge-arbitration">⚖️ 待裁決</span>`;
      }
      if (exam.reportStatus === "已認證") {
        return `<span class="badge badge-certified">✅ 已認證</span>`;
      }
      return `<span class="badge badge-pending">⏳ 未完成</span>`;
    }

    function getReportDoctorDisplayHtml(exam) {
      if (exam.reportDoctor === "未指派") {
        return `<span class="badge badge-unassigned">⚠️ 未指派</span>`;
      }
      if (exam.category === "健檢乳攝" && exam.dualRead) {
        const assigned = exam.dualRead.assignedReaders || ["醫師甲", "醫師丙"];
        const arbDoc = exam.dualRead.arbitratorDoctor || "醫師乙";
        const docA = assigned[0];
        const docB = assigned[1];
        const needsOrHasArbitrator = exam.reportStatus === "待裁決" || Boolean(exam.dualRead.arbitrator);
        if (needsOrHasArbitrator) {
          return `<div style="line-height: 1.35;"><div>${docA}</div><div>${docB}</div><div>${arbDoc}</div></div>`;
        }
        return `<div style="line-height: 1.35;"><div>${docA}</div><div>${docB}</div></div>`;
      }
      return exam.reportDoctor;
    }

    // =========================================================================
    // 2. 工作清單渲染與統計邏輯
    // =========================================================================
    function renderWorklist() {
      renderSummaryCards();

      const filtered = getFilteredExams();
      const tbody = document.getElementById("worklist-tbody");
      const countEl = document.getElementById("worklist-result-count");
      countEl.textContent = `目前顯示 ${filtered.length} 筆（總資料庫共 ${exams.length} 筆）`;

      if (filtered.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="13" style="text-align: center; padding: 28px; color: var(--text-muted);">
              沒有符合目前篩選條件的檢查單。若要查看已 DC 或未照影像的單據，請勾選上方的「特殊單據顯示設定」或切換報告醫師。
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = filtered.map(exam => {
        // 決定列底色樣式
        let rowClass = "row-status-pending";
        if (exam.orderStatus === "已DC") {
          rowClass = "row-status-dc";
        } else if (exam.imageStatus === "未照") {
          rowClass = "row-status-noimg";
        } else if (exam.reportStatus === "待裁決") {
          rowClass = "row-status-arbitration";
        } else if (exam.reportStatus === "已完成") {
          rowClass = "row-status-saved";
        } else if (exam.reportStatus === "已認證") {
          rowClass = "row-status-certified";
        }

        // 醫令狀態 Badge
        const orderBadge = exam.orderStatus === "已DC"
          ? `<span class="badge badge-dc">🚫 已DC</span>`
          : `<span class="badge badge-ok">正常</span>`;

        // 影像狀態 Badge
        const imgBadge = exam.imageStatus === "已照"
          ? `<span class="badge badge-img">📷 已照</span>`
          : `<span class="badge badge-noimg">⏳ 未照</span>`;

        // 報告狀態 Badge
        const reportBadge = getReportStatusBadgeHtml(exam);
        const doctorCellHtml = getReportDoctorDisplayHtml(exam);

        const loginDoc = getCurrentLoginDoctor();
        let actionBtnText = exam.reportStatus === "未完成" ? "撰寫報告" : "檢視/修改";
        if (exam.category === "健檢乳攝" && exam.dualRead) {
          const reports = exam.dualRead.reports || {};
          if (exam.reportStatus === "未完成" || exam.reportStatus === "已完成") {
            actionBtnText = reports[loginDoc] ? "檢視/修改" : "撰寫報告";
          } else if (exam.reportStatus === "待裁決") {
            actionBtnText = "⚖️ 進入裁決";
          }
        }

        return `
          <tr class="${rowClass}" onclick="openReport('${exam.id}')">
            <td><strong>${exam.id}</strong></td>
            <td>${exam.examDateTime}</td>
            <td>${exam.category}</td>
            <td><strong>${exam.examName}</strong></td>
            <td>${exam.dept}</td>
            <td>${exam.orderDoctor}</td>
            <td>${exam.patientName}（${exam.gender}／${exam.age}）</td>
            <td><code>${exam.nationalId}</code></td>
            <td>${orderBadge}</td>
            <td>${imgBadge}</td>
            <td>${reportBadge}</td>
            <td>${doctorCellHtml}</td>
            <td>
              <button class="btn btn-sm btn-primary" onclick="event.stopPropagation(); openReport('${exam.id}')">
                ${actionBtnText}
              </button>
            </td>
          </tr>
        `;
      }).join("");
    }

    function getCurrentLoginDoctor() {
      const el = document.getElementById("login-doctor");
      return el ? el.value : "醫師甲";
    }

    function onLoginDoctorChange() {
      const loginDoc = getCurrentLoginDoctor();
      document.getElementById("filter-doctor").value = loginDoc;
      if (currentExamId) {
        renderReportView();
      } else {
        renderWorklist();
      }
      showToast(`已切換登入醫師為：${loginDoc}`);
    }

    // 計算並渲染頂部「未完成報告分項數量與總數」
    function renderSummaryCards() {
      const includeDc = document.getElementById("chk-count-dc").checked;
      const includeNoImg = document.getElementById("chk-count-noimg").checked;
      const includeOtherDoc = document.getElementById("chk-count-otherdoc").checked;
      const currentCategoryFilter = document.getElementById("filter-category").value;
      const loginDoc = getCurrentLoginDoctor();

      // 過濾納入計算待辦／未完成的集合（含乳攝待二讀盲讀與待第三人裁決）
      const pendingList = exams.filter(e => {
        const isMammoPendingAction =
          e.category === "健檢乳攝" &&
          e.dualRead &&
          (e.reportStatus === "未完成" || e.reportStatus === "已完成" || e.reportStatus === "待裁決");

        if (!isMammoPendingAction && e.reportStatus !== "未完成") return false;
        if (!includeDc && e.orderStatus === "已DC") return false;
        if (!includeNoImg && e.imageStatus === "未照") return false;
        if (!includeOtherDoc && !isExamActionableForDoctor(e, loginDoc)) return false;
        return true;
      });

      const totalPending = pendingList.length;
      const countsByCategory = {};
      ALL_CATEGORIES.forEach(cat => { countsByCategory[cat] = 0; });
      pendingList.forEach(e => {
        if (countsByCategory[e.category] !== undefined) {
          countsByCategory[e.category]++;
        }
      });

      const container = document.getElementById("summary-cards-container");
      let html = `
        <div class="stat-card total-card ${currentCategoryFilter === 'ALL' ? 'active' : ''}" onclick="quickFilterCategory('ALL')" title="點此顯示全部檢查類別">
          <span class="stat-label">總數：</span>
          <span class="stat-num">${totalPending}</span>
        </div>
      `;

      ALL_CATEGORIES.forEach(cat => {
        const count = countsByCategory[cat];
        const isActive = currentCategoryFilter === cat ? "active" : "";
        html += `
          <div class="stat-card ${isActive}" onclick="quickFilterCategory('${cat}')">
            <span class="stat-label">${cat}：</span>
            <span class="stat-num" style="color: ${count > 0 ? 'var(--primary)' : 'var(--text-muted)'}">${count}</span>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    function quickFilterCategory(cat) {
      document.getElementById("filter-category").value = cat;
      renderWorklist();
    }

    function isExamMatchingDoctorFilter(exam, doctor) {
      if (doctor === "ALL") return true;
      if (exam.reportDoctor === doctor) return true;
      if (exam.category === "健檢乳攝" && exam.dualRead && exam.reportDoctor !== "未指派") {
        const assigned = exam.dualRead.assignedReaders || ["醫師甲", "醫師丙"];
        if (assigned.includes(doctor)) return true;
        if (exam.reportStatus === "待裁決" && (exam.dualRead.arbitratorDoctor || "醫師乙") === doctor) return true;
        if (exam.dualRead.arbitrator && exam.dualRead.arbitrator.doctor === doctor) return true;
      }
      return false;
    }

    function getFilteredExams() {
      const doctor = document.getElementById("filter-doctor").value;
      const dateType = document.getElementById("filter-date-type").value;
      const dateVal = document.getElementById("filter-date").value;
      const status = document.getElementById("filter-status").value;
      const category = document.getElementById("filter-category").value;
      const dept = document.getElementById("filter-dept").value;
      const orderDoc = document.getElementById("filter-order-doc").value;
      const keyword = document.getElementById("filter-keyword").value.trim().toLowerCase();

      const showDc = document.getElementById("chk-show-dc").checked;
      const showNoImg = document.getElementById("chk-show-noimg").checked;

      let list = exams.filter(e => {
        // 特殊單據預設不顯示（使用者設計決定 3）
        if (!showDc && e.orderStatus === "已DC") return false;
        if (!showNoImg && e.imageStatus === "未照") return false;

        if (!isExamMatchingDoctorFilter(e, doctor)) return false;
        if (dateVal !== "ALL") {
          const targetDate = dateType === "exam" ? e.examDate : e.orderDate;
          if (targetDate !== dateVal) return false;
        }
        if (status !== "ALL" && e.reportStatus !== status) return false;
        if (category !== "ALL" && e.category !== category) return false;
        if (dept !== "ALL" && e.dept !== dept) return false;
        if (orderDoc !== "ALL" && e.orderDoctor !== orderDoc) return false;
        if (keyword) {
          const match = e.id.toLowerCase().includes(keyword) ||
                        e.nationalId.toLowerCase().includes(keyword) ||
                        e.patientName.toLowerCase().includes(keyword) ||
                        e.examName.toLowerCase().includes(keyword);
          if (!match) return false;
        }
        return true;
      });

      // 排序
      list.sort((a, b) => {
        const valA = a[sortField] || "";
        const valB = b[sortField] || "";
        if (valA < valB) return sortAsc ? -1 : 1;
        if (valA > valB) return sortAsc ? 1 : -1;
        return 0;
      });

      return list;
    }

    function setSort(field) {
      if (sortField === field) {
        sortAsc = !sortAsc;
      } else {
        sortField = field;
        sortAsc = true;
      }
      // 更新表頭箭頭
      const fields = ["id", "examDateTime", "category", "examName", "dept", "orderDoctor", "patientName", "nationalId", "orderStatus", "imageStatus", "reportStatus", "reportDoctor"];
      fields.forEach(f => {
        const el = document.getElementById("sort-" + f);
        if (el) el.textContent = f === sortField ? (sortAsc ? "▲" : "▼") : "";
      });
      renderWorklist();
    }

    function clearFilters() {
      const loginDoc = getCurrentLoginDoctor();
      document.getElementById("filter-doctor").value = loginDoc;
      document.getElementById("filter-date-type").value = "exam";
      document.getElementById("filter-date").value = "ALL";
      document.getElementById("filter-status").value = "ALL";
      document.getElementById("filter-category").value = "ALL";
      document.getElementById("filter-dept").value = "ALL";
      document.getElementById("filter-order-doc").value = "ALL";
      document.getElementById("filter-keyword").value = "";
      document.getElementById("chk-show-dc").checked = false;
      document.getElementById("chk-show-noimg").checked = false;
      renderWorklist();
      showToast(`已恢復預設篩選條件（登入醫師：${loginDoc}，隱藏已DC與未照）`);
    }

    // =========================================================================
    // 3. 打報告畫面（Reporting View）與自動跳轉邏輯
    // =========================================================================
    function openReport(examId) {
      stopCinePlayback(false);
      currentExamId = examId;
      currentSeriesPos = 0;
      pacsZoom = 1.0;
      pacsPanX = 0;
      pacsPanY = 0;
      selectedHistoryIndex = null;
      document.getElementById("view-worklist").classList.add("hidden");
      document.getElementById("view-report").classList.remove("hidden");
      renderReportView();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function backToWorklist() {
      stopCinePlayback(false);
      if (isPacsFullscreen) {
        togglePacsFullscreen();
      }
      currentExamId = null;
      document.getElementById("view-report").classList.add("hidden");
      document.getElementById("view-worklist").classList.remove("hidden");
      renderWorklist();
    }

    function renderReportView() {
      const exam = exams.find(e => e.id === currentExamId);
      if (!exam) return;

      // 1. 渲染頂部上下文（上一筆 / 目前筆 / 下一筆）
      renderContextStrip(exam);

      // 2. 特殊狀態警示（已 DC 或未照影像）
      const warnEl = document.getElementById("report-warning-banner");
      if (exam.orderStatus === "已DC" || exam.imageStatus === "未照") {
        warnEl.classList.remove("hidden");
        const reasons = [];
        if (exam.orderStatus === "已DC") reasons.push("🚫 此檢查單【醫令已 DC（取消開單）】");
        if (exam.imageStatus === "未照") reasons.push("📷 此檢查單【尚未照影像（未照）】");
        warnEl.innerHTML = `${reasons.join("、")}。請確認是否仍需撰寫或處理此報告。`;
      } else {
        warnEl.classList.add("hidden");
      }

      // 3. 渲染個案必要資訊（單號、姓名、性別、年齡、身分證號、檢查名稱、檢查日期時間、目前狀態）+ 門診 HIS 資訊
      const bannerEl = document.getElementById("patient-banner-container");
      const statusBadgeHtml = getReportStatusBadgeHtml(exam);

      let hisHtml = "";
      if (exam.hisInfo) {
        hisHtml = `
          <div class="his-box">
            <div><strong style="color:var(--color-text);">診斷：</strong>${exam.hisInfo.diagnosis}</div>
            <div><strong style="color:var(--color-text);">主訴：</strong>${exam.hisInfo.subjective}</div>
            <div><strong style="color:var(--color-text);">客觀檢查：</strong>${exam.hisInfo.objective}</div>
          </div>
        `;
      }

      bannerEl.innerHTML = `
        <div class="patient-grid">
          <div class="info-item"><span class="info-label">單號：</span><span class="info-value">${exam.id}</span></div>
          <div class="info-item"><span class="info-label">病人姓名：</span><span class="info-value">${exam.patientName}（${exam.gender}／${exam.age}歲）</span></div>
          <div class="info-item"><span class="info-label">身分證號：</span><span class="info-value"><code>${exam.nationalId}</code></span></div>
          <div class="info-item"><span class="info-label">檢查名稱：</span><span class="info-value" style="color:var(--primary);">${exam.examName}</span></div>
          <div class="info-item"><span class="info-label">檢查日期時間：</span><span class="info-value">${exam.examDateTime}</span></div>
          <div class="info-item"><span class="info-label">目前狀態：</span><span class="info-value">${statusBadgeHtml} ${exam.orderStatus === '已DC' ? '<span class="badge badge-dc">🚫 已DC</span>' : ''}</span></div>
        </div>
        ${hisHtml}
      `;

      // 4. 渲染左側 PACS 影像示意區與過去報告清單
      renderPacsViewport(exam);
      renderHistoryList(exam);

      // 5. 決定健檢乳攝雙線各自獨立判讀階段與當前草稿內容（兩位醫師各自擁有獨立草稿與已提交報告，互不干擾、不互相看到）
      const loginDoc = getCurrentLoginDoctor();
      const isMammoDual = exam.category === "健檢乳攝" && exam.dualRead;
      const dualContainer = document.getElementById("mammo-dual-read-container");
      let activeDraftContent = exam.reportContent || {};

      if (isMammoDual) {
        const assigned = exam.dualRead.assignedReaders || ["醫師甲", "醫師丙"];
        const reports = exam.dualRead.reports || {};
        const drafts = exam.dualRead.drafts || {};
        const arb = exam.dualRead.arbitrator;
        const docA = assigned[0];
        const docB = assigned[1];
        const repA = reports[docA];
        const repB = reports[docB];

        if (exam.reportStatus === "未完成" || exam.reportStatus === "已完成") {
          // 雙線平行判讀階段：每位醫師只讀取自己那條線的已提交報告或草稿
          if (reports[loginDoc]) {
            currentMammoBirads = reports[loginDoc].birads || "";
            activeDraftContent = {
              Findings: reports[loginDoc].findings || "",
              Diagnosis: reports[loginDoc].diagnosis || ""
            };
          } else {
            if (!drafts[loginDoc]) {
              drafts[loginDoc] = { birads: "", Findings: "", Diagnosis: "" };
            }
            currentMammoBirads = drafts[loginDoc].birads || "";
            activeDraftContent = {
              Findings: drafts[loginDoc].Findings || "",
              Diagnosis: drafts[loginDoc].Diagnosis || ""
            };
          }
        } else if (exam.reportStatus === "待裁決" && repA && repB) {
          if (!exam.dualRead.arbitrationDraft) {
            exam.dualRead.arbitrationDraft = {
              birads: "",
              Findings: repA.findings || repB.findings || "",
              Diagnosis: ""
            };
          }
          currentMammoBirads = exam.dualRead.arbitrationDraft.birads || "";
          activeDraftContent = {
            Findings: exam.dualRead.arbitrationDraft.Findings || "",
            Diagnosis: exam.dualRead.arbitrationDraft.Diagnosis || ""
          };
        } else if (exam.reportStatus === "已認證") {
          currentMammoBirads = (arb && arb.birads) || (repA && repA.birads) || (repB && repB.birads) || "1";
          activeDraftContent = exam.reportContent;
        }

        renderMammoDualReadPanel(exam, loginDoc);
      } else {
        dualContainer.classList.add("hidden");
        dualContainer.innerHTML = "";
        currentMammoBirads = "";
      }

      // 6. 渲染右側範本欄位與片語按鈕（健檢乳攝之 Diagnosis 欄位下方直接放置 BI-RADS 0~5 膠囊按鈕，並刪除原本 Diagnosis 下方的片語按鈕）
      const tpl = REPORT_TEMPLATES[exam.category];

      const fieldsContainer = document.getElementById("template-fields-container");
      if (tpl) {
        fieldsContainer.innerHTML = tpl.fields.map(field => {
          const val = (activeDraftContent && activeDraftContent[field.key]) ? activeDraftContent[field.key] : "";
          const isMammoDiagnosis = (exam.category === "健檢乳攝" && field.key === "Diagnosis");

          let chipAreaHtml = "";
          if (isMammoDiagnosis) {
            const biradsPillsHtml = BIRADS_OPTIONS.map(opt => {
              const isActive = String(currentMammoBirads) === opt.code ? "active" : "";
              return `
                <button type="button" class="birads-pill ${isActive}" onclick="selectMammoBirads('${opt.code}', true)">
                  ${opt.label}
                </button>
              `;
            }).join("");
            chipAreaHtml = `
              <div class="phrase-group" id="birads-selector-box">
                ${biradsPillsHtml}
              </div>
            `;
          } else {
            const phraseButtons = field.phrases.map(p => {
              const escaped = p.replace(/'/g, "\\'");
              return `<button type="button" class="phrase-chip" onclick="insertPhrase('${field.key}', '${escaped}')">➕ ${p}</button>`;
            }).join("");
            chipAreaHtml = `
              <div class="phrase-group">
                ${phraseButtons}
              </div>
            `;
          }
